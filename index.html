<style>

  .pin.sombre { color:#1d2733; } .pin.f-rond { border-radius:50%; } .pin.f-carre { border-radius:7px; }

  #liste button:hover { background:#f1f4f8; } #liste i { flex:none; width:10px; height:10px; border-radius:50%; border:1px solid #0005; }

  .rg-sous { font-size:12px; font-weight:700; color:var(--muted); margin:8px 0 2px; text-transform:uppercase; }
  .rg-l2 select { max-width:100%; } .rg-corps input[type=color] { width:38px; height:28px; padding:0; border:1px solid var(--line); border-radius:6px; }

const MODE_CLASSIQUE = 'Regroupement classique (selon le zoom)', MODE_PROCHES = 'Seulement les points très proches', MODE_AUCUN = 'Aucun regroupement';

}

async function itiCalculer() {
  if (iti.ids.length < (iti.depart ? 1 : 2)) { iti.msg = 'Ajoutez au moins 2 établissements (ou 1 établissement et un départ).'; itiDessiner(); return; }
  iti.msg = 'Calcul en cours…'; itiDessiner(); itiRoute.clearLayers();
  const url = String(opt('iti_url', 'https://data.geopf.fr/navigation/itineraire')), res = String(opt('iti_resource', 'bdtopo-osrm'));
  const pts = (iti.depart ? [iti.depart] : []).concat(iti.ids.map(ptDe)); if (iti.retour) pts.push(pts[0]);
  const legs = []; let td = 0, tt = 0, ko = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    try {
      const r = await fetch(`${url}?resource=${encodeURIComponent(res)}&start=${a.lng},${a.lat}&end=${b.lng},${b.lat}&profile=${iti.mode}&optimization=fastest&geometryFormat=geojson&getSteps=false&distanceUnit=meter&timeUnit=second`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(), d = (+j.distance || 0) * (j.distanceUnit === 'kilometer' ? 1000 : 1), t = (+j.duration || 0) * (j.timeUnit === 'hour' ? 3600 : j.timeUnit === 'minute' ? 60 : 1);
      legs.push({ d, t }); td += d; tt += t;
      if (j.geometry) L.geoJSON(j.geometry, { style:{ color: iti.mode === 'car' ? '#1f4e8c' : '#2a9d8f', weight:5, opacity:.85, dashArray: iti.mode === 'car' ? null : '2 8', lineCap:'round' }, interactive:false }).addTo(itiRoute);
    } catch (e) { legs.push(null); ko++; }
    await new Promise(ok => setTimeout(ok, 230));   // le service accepte 5 requêtes par seconde
  }
  iti.legs = legs; iti.total = { d:td, t:tt };
  iti.msg = ko ? `${ko} trajet(s) non calculé(s) : service injoignable ou point hors du réseau routier.` : '';
  itiDessiner(); if (itiRoute.getLayers().length) map.fitBounds(itiRoute.getBounds(), { padding:[50,50] });
}
function itiTexte() {
  const l = [`Itinéraire de contrôle – ${iti.mode === 'car' ? 'voiture' : 'à pied'}`];
  iti.ids.forEach((id, k) => { const g = iti.legs.length ? iti.legs[iti.depart ? k : k - 1] : undefined; l.push(`${k + 1}. ${nomDe(id)}${g ? ` (${fmtDist(g.d)}, ${fmtDuree(g.t)})` : ''}`); });
  if (iti.total) l.push(`Total : ${fmtDist(iti.total.d)}, ${fmtDuree(iti.total.t)}`);
  return l.join('\n');
}
function itiCopier(b) {
  const txt = itiTexte(), ok = () => { b.textContent = '✓ Copié'; };
  const secours = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { alert(txt); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, secours); else secours();
}

      <div class="rg-l2"><input type="text" data-a="bb-b" ${E} data-f="txt" value="${esc(x.txt)}" placeholder="Symbole ou emoji" style="max-width:150px" aria-label="Symbole"><input type="text" data-a="bb-b" ${E} data-f="ti" value="${esc(x.ti)}" placeholder="Infobulle" aria-label="Infobulle"></div></li>`; }).join('')}</ul></section>`;
}
function blocEntete(k) {
  const h = cfg.entetes[k], D = `data-a="eh" data-h="${k}"`, opts_ = (val, vide) => `<option value="">${vide}</option>` + allCols.map(c => `<option value="${esc(c)}"${c === val ? ' selected' : ''}>${esc(libel(c))}</option>`).join('');
  return `<section><h3>En-tête ${k === 'popup' ? 'du popup' : 'de la fiche'}</h3>
    <label>Titre <select ${D} data-f="titre">${opts_(h.titre, 'Nom de l’établissement')}</select></label>
    <label>Sous-titre <select ${D} data-f="sous">${opts_(h.sous, 'Aucun')}</select></label>
    <label><input type="checkbox" ${D} data-f="etiq"${h.etiq ? ' checked' : ''}> Afficher l’étiquette de la règle (ex. « Critique »)</label>
    <label>Fond <select ${D} data-f="fond"><option value="neutre"${h.fond === 'neutre' ? ' selected' : ''}>Gris clair</option><option value="point"${h.fond === 'point' ? ' selected' : ''}>Couleur du point</option><option value="perso"${h.fond === 'perso' ? ' selected' : ''}>Couleur personnalisée</option></select>
      ${h.fond === 'perso' ? `<input type="color" ${D} data-f="fondc" value="${h.fondc}" aria-label="Couleur du fond">` : ''}</label>
    <label><input type="checkbox" data-a="eh-txt-on" data-h="${k}"${h.txtc ? ' checked' : ''}> Couleur du titre <input type="color" ${D} data-f="txtc" value="${h.txtc || '#1d2733'}"${h.txtc ? '' : ' disabled'} aria-label="Couleur du titre"></label>
    <label>Taille du titre (0 = automatique) <input type="number" min="0" max="30" ${D} data-f="taille" value="${h.taille}"> px</label></section>`;
}
function contenuOnglet() {
  if (onglet === 'points') return `<section><h3>Style par défaut des points</h3><div class="rg-l2"><label>Couleur <input type="color" data-a="defc" value="${cfg.defaut.couleur}"></label><label>Forme ${selForme('data-a="deff"', cfg.defaut.forme)}</label><label>Bordure <input type="color" data-a="defbc" value="${cfg.defaut.bordc}" aria-label="Couleur de la bordure"> <input type="number" min="0" max="8" data-a="defbe" value="${cfg.defaut.borde}" style="width:56px" aria-label="Épaisseur de la bordure"> px</label></div></section>
    <p class="vide" style="font-size:12px">Chaque règle s’applique aux points qui remplissent toutes ses conditions. Pour la couleur, la forme et le contenu, la première règle qui en définit une l’emporte.</p>
    ${cfg.regles.map(carteRegle).join('')}<button type="button" class="rg-ajout" data-a="radd">+ Ajouter une règle</button>`;
  if (onglet === 'popup') return blocEntete('popup') + `<section><h3>Colonnes du popup (clic sur un point)</h3>${blocListe('p')}</section>`;
  if (onglet === 'fiche') return blocEntete('fiche') + cfg.sections.map((sec, i) => `<section><div class="rg-sec"><input type="text" value="${esc(sec.nom)}" data-a="nom" data-g="${i}" aria-label="Nom de la section" placeholder="Nom de la section">${btn('sup', `data-g="${i}"`, '▲', 'Monter')}${btn('sdown', `data-g="${i}"`, '▼', 'Descendre')}${btn('sdel', `data-g="${i}"`, 'Supprimer')}</div>${blocListe(String(i))}</section>`).join('') + '<button type="button" class="rg-ajout" data-a="sadd">+ Ajouter une section</button>';
  if (onglet === 'barre') return blocBarre();
  if (onglet === 'filtres') return blocFiltres();
  if (onglet === 'prog') return blocProg();
  if (onglet === 'calques') return blocCalques();
  const sl = (n, ch) => `<select data-o="${n}">${ch.map(c => `<option${opt(n, ch[0]) === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  const elts = [['q', 'Recherche par nom'], ['filtres', 'Filtres'], ['compteurs', 'Compteurs'], ['liste', 'Liste des établissements'], ['tout', 'Bouton « Voir tous les points »'], ['legende', 'Légende'], ['iti', 'Bouton « Préparer un itinéraire »'], ['commune', 'Recherche de commune (en haut à droite de la carte)']];
  return `<section><h3>Éléments du panneau de gauche</h3><p class="vide" style="font-size:12px;margin:0 0 4px">Cochez les éléments à proposer, changez leur ordre avec ▲ ▼ et modifiez leurs textes. Le panneau défile si les éléments dépassent la hauteur du widget.</p>
    <ul>${cfg.ordre.map(k => { const E = `data-e="${k}"`, L_ = LIB[k]; return `<li class="rg-ord"><div class="rg-l1"><label><input type="checkbox" data-o="aff_${k}"${opt('aff_' + k, true) !== false ? ' checked' : ''}> <b>${ELTS_GAUCHE[k]}</b></label>${btn('ord-up', E, '▲', 'Monter')}${btn('ord-down', E, '▼', 'Descendre')}</div>
      ${L_ ? `<div class="rg-l2"><input type="text" data-o="${L_[0]}" value="${esc(opt(L_[0], L_[1]))}" placeholder="Texte affiché" aria-label="Texte : ${esc(ELTS_GAUCHE[k])}">${k === 'liste' ? `<input type="text" data-o="lib_liste2" value="${esc(opt('lib_liste2', 'Masquer la liste des établissements'))}" placeholder="Texte quand la liste est ouverte" aria-label="Texte quand la liste est ouverte">` : ''}</div>` : ''}
      ${k === 'liste' || k === 'legende' ? `<div class="rg-l2"><label><input type="checkbox" data-o="ouv_${k}"${(k === 'liste' ? opt('ouv_liste', false) === true : opt('ouv_legende', true) !== false) ? ' checked' : ''}> déplié par défaut</label></div>` : ''}</li>`; }).join('')}</ul></section>
    <section><h3>Apparence</h3>
    <label>Police d’écriture ${sl('police', Object.keys(POLICES))}</label>
    <p class="vide" style="font-size:12px;margin:0 0 4px">La police Marianne s’affiche si elle est installée sur le poste, ou si ses fichiers sont placés dans le dossier lib/fonts du widget.</p>
    <label>Emplacement de la recherche de commune ${sl('pos_commune', POS_COMMUNE)}</label>
    <label>Largeur du panneau de gauche <input type="number" min="220" max="520" data-o="largeur_gauche" value="${+opt('largeur_gauche', 300)}"> px</label></section>
    ${blocEtiquette('liste', 'Étiquette devant le nom (liste des établissements)')}
    ${blocEtiquette('legende', 'Étiquette de la légende')}
    <section><h3>Itinéraire</h3><label>Adresse du service de calcul d’itinéraire <input type="text" data-o="iti_url" value="${esc(opt('iti_url', 'https://data.geopf.fr/navigation/itineraire'))}"></label>
    <label>Ressource <input type="text" data-o="iti_resource" value="${esc(opt('iti_resource', 'bdtopo-osrm'))}"></label></section>
    <section><h3>Fiche et points</h3><label>Sections dépliées à l’ouverture ${sl('ouverture', ['Première section', 'Toutes', 'Aucune'])}</label>
    <label>Regroupement des points ${sl('regroupement', [MODE_PROCHES, MODE_AUCUN, MODE_CLASSIQUE])}</label>
    <label>Distance de regroupement (points plus proches que cette distance) <input type="number" min="5" max="5000" step="5" data-o="distance_m" value="${+opt('distance_m', 100)}"> m</label>
    <label>Taille des points <input type="number" min="16" max="48" data-o="taille" value="${+opt('taille', 30)}"> px</label>
    <label>Taille du texte du popup <input type="number" min="10" max="22" data-o="taille_popup" value="${+opt('taille_popup', 13)}"> px</label>
    <label>Taille du texte de la fiche <input type="number" min="10" max="24" data-o="taille_fiche" value="${+opt('taille_fiche', 14)}"> px</label></section>`;
}
function dessiner() {
  const y = (modal.querySelector('.rg-corps') || {}).scrollTop || 0;
  modal.innerHTML = `<div class="rg-boite" role="dialog" aria-label="Configurer le widget"><div class="rg-tete"><h2>Configurer le widget</h2><span id="rg-etat" class="rg-etat">${esc(etatSauv)}</span>${btn('fermer', '', 'Fermer')}</div>
    <div class="rg-onglets">${[['points', 'Affichage des points'], ['popup', 'Popup'], ['fiche', 'Fiche'], ['filtres', 'Filtres'], ['prog', 'Progression'], ['calques', 'Calques'], ['barre', 'Barre de boutons'], ['general', 'Général']].map(([k, t]) => `<button type="button" data-a="onglet" data-t="${k}" aria-pressed="${onglet === k}">${t}</button>`).join('')}</div>
    <div class="rg-corps">${erreurAcces ? `<p style="color:#c1121f;font-size:13px">Impossible de lire toutes les colonnes : vérifiez que le widget est en « Accès complet » dans le panneau de droite de Grist.</p>` : ''}${contenuOnglet()}</div></div>`;
  modal.querySelector('.rg-corps').scrollTop = y;
}
function ouvrirReglages() { dessiner(); modal.classList.add('ouvert'); }
function etat(t) { etatSauv = t; const e = document.getElementById('rg-etat'); if (e) e.textContent = t; }
function enregistrer() {
  clearTimeout(minuteur); etat('Enregistrement…');
  minuteur = setTimeout(() => {
    opts.cfg = cfg;
    Promise.resolve().then(() => grist.setOptions ? grist.setOptions(opts) : grist.setOption('cfg', cfg))
      .then(() => etat('✓ Enregistré')).catch(e => etat('⚠ Non enregistré : ' + ((e && e.message) || e)));
  }, 300);
}
function sauver(redessiner = true) { enregistrer(); construire(); if (redessiner) dessiner(); }
modal.addEventListener('click', e => {
  if (e.target === modal) { modal.classList.remove('ouvert'); return; }
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a, g = b.dataset.g, i = +b.dataset.i, r = +b.dataset.r, k = +b.dataset.k;
  switch (a) {
    case 'fermer': modal.classList.remove('ouvert'); return;
    case 'onglet': onglet = b.dataset.t; dessiner(); return;
    case 'up': case 'down': deplacer(listeDe(g), i, a === 'up' ? -1 : 1); break;
    case 'del': listeDe(g).splice(i, 1); break;
    case 'sup': case 'sdown': deplacer(cfg.sections, +g, a === 'sup' ? -1 : 1); break;
    case 'sdel': if (!confirm('Supprimer cette section ?')) return; cfg.sections.splice(+g, 1); break;
    case 'sadd': cfg.sections.push({ nom:'Nouvelle section', cols:[] }); break;
    case 'radd': cfg.regles.push(nRegle({ o:true, si:[{ c:'', op:'=', v:'' }], couleur:'#c1121f' })); break;
    case 'rup': case 'rdown': deplacer(cfg.regles, r, a === 'rup' ? -1 : 1); break;
    case 'rdel': cfg.regles.splice(r, 1); break;
    case 'cadd': cfg.regles[r].si.push({ c:'', op:'=', v:'' }); break;
    case 'cdel': cfg.regles[r].si.splice(k, 1); break;
    case 'fl-add': cfg.filtres.push(nFiltre({})); break;
    case 'fl-up': case 'fl-down': deplacer(cfg.filtres, i, a === 'fl-up' ? -1 : 1); break;
    case 'fl-del': cfg.filtres.splice(i, 1); break;
    case 'pi-add': { const ia = allCols.find(c => /attendu/i.test(libel(c))), ifa = allCols.find(c => /contr.le.*2026/i.test(libel(c))); cfg.prog.inds.push(nInd({ nom:'Contrôles réalisés / attendus', fait:ifa || '', att:ia || '' })); break; }
    case 'pi-del': cfg.prog.inds.splice(i, 1); break;
    case 'cq-add': cfg.calques.push(nCalque({})); break;
    case 'cq-up': case 'cq-down': deplacer(cfg.calques, i, a === 'cq-up' ? -1 : 1); break;
    case 'cq-del': cfg.calques.splice(i, 1); break;
    case 'bb-up': case 'bb-down': { const l = cfg.barre.boutons, i = l.findIndex(x => x.id === b.dataset.e), j = i + (a === 'bb-up' ? -1 : 1); if (i >= 0 && j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; break; }
    case 'ord-up': case 'ord-down': { const i = cfg.ordre.indexOf(b.dataset.e), j = i + (a === 'ord-up' ? -1 : 1); if (i >= 0 && j >= 0 && j < cfg.ordre.length) [cfg.ordre[i], cfg.ordre[j]] = [cfg.ordre[j], cfg.ordre[i]]; break; }
    default: return;
  }
  sauver();
});
modal.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.o) {
    const n = t.dataset.o, v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.min(+t.max || 48, Math.max(+t.min || 1, +t.value || +t.defaultValue || 1)) : t.value;
    opts[n] = v; construire(); enregistrer(); if (n === 'liste_devant') dessiner(); return;
  }
  const a = t.dataset.a; if (!a) return;
  const g = t.dataset.g, i = +t.dataset.i, r = +t.dataset.r, k = +t.dataset.k, R = cfg.regles[r];
  switch (a) {
    case 'add': if (t.value) listeDe(g).push({ c:t.value, nom:'', gn:false, gi:false, vg:false, vi:false, vb:false, ta:'' }); break;
    case 'lib': listeDe(g)[i].nom = t.value; break;
    case 'gn': case 'gi': case 'vg': case 'vi': case 'vb': listeDe(g)[i][a] = t.checked; break;
    case 'ta': listeDe(g)[i].ta = t.value; break;
    case 'cn-on': listeDe(g)[i].cn = t.checked ? '#1d2733' : ''; break;
    case 'cn': listeDe(g)[i].cn = t.value; break;
    case 'cw-on': listeDe(g)[i].cw = t.checked ? '#1d2733' : ''; break;
    case 'cw': listeDe(g)[i].cw = t.value; break;
    case 'rbt': R.bulle.t = t.value; break;
    case 'rbs': R.bulle.src = t.value; break;
    case 'rbc': R.bulle.c = t.value; break;
    case 'rbe': R.bulle.e = t.value; break;
    case 'rbk': R.bulle.couleur = t.value; break;
    case 'rbp': R.bulle.pulse = t.checked; break;
    case 'defbc': cfg.defaut.bordc = t.value; break;
    case 'defbe': cfg.defaut.borde = Math.max(0, Math.min(8, t.value === '' ? 3 : +t.value || 0)); break;
    case 'rd-on': R.bordc = t.checked ? '#1d2733' : ''; if (t.checked && !R.borde) R.borde = 3; break;
    case 'rdc': R.bordc = t.value; break;
    case 'rde': R.borde = Math.max(0, Math.min(8, t.value === '' ? 3 : +t.value || 0)); break;
    case 'eh': { const H = cfg.entetes[t.dataset.h]; H[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (+t.value || 0) : t.value; break; }
    case 'eh-txt-on': cfg.entetes[t.dataset.h].txtc = t.checked ? '#1d2733' : ''; break;
    case 'fl': { const F = cfg.filtres[+t.dataset.i]; if (F) F[t.dataset.f] = t.value; break; }
    case 'pg': { cfg.prog[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; break; }
    case 'pi': { const X = cfg.prog.inds[+t.dataset.i]; if (X) X[t.dataset.f] = t.type === 'number' ? Math.max(+t.min, Math.min(+t.max, +t.value || 0)) : t.value; break; }
    case 'cq': { const Q = cfg.calques[+t.dataset.i]; if (Q) Q[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.max(+t.min, Math.min(+t.max, t.value === '' ? +t.defaultValue : +t.value)) : t.value; break; }
    case 'bb': { cfg.barre[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.max(+t.min, Math.min(+t.max, t.value === '' ? +t.defaultValue : +t.value)) : t.value; break; }
    case 'bb-b': { const x = cfg.barre.boutons.find(y => y.id === t.dataset.e); if (x) x[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; break; }
    case 'et': { const E = cfg.etiquettes[t.dataset.ek], f = t.dataset.f; if (t.type === 'number') { const n = t.value === '' ? +t.defaultValue : +t.value; E[f] = Math.max(+t.min, Math.min(+t.max, isNaN(n) ? +t.min : n)); } else E[f] = t.value; break; }
    case 'nom': cfg.sections[+g].nom = t.value; break;
    case 'defc': cfg.defaut.couleur = t.value; break;
    case 'deff': cfg.defaut.forme = t.value; break;
    case 'rnom': R.nom = t.value; break;
    case 'rc-on': R.couleur = t.checked ? '#c1121f' : ''; break;
    case 'rc': R.couleur = t.value; break;
    case 'rf-on': R.forme = t.checked ? 'rond' : ''; break;
    case 'rf': R.forme = t.value; break;
    case 'rct': R.contenu.t = t.value; break;
    case 're': R.contenu.e = t.value; break;
    case 'rcc': R.contenu.c = t.value; break;
    case 'cc': R.si[k].c = t.value; break;
    case 'co': R.si[k].op = t.value; break;
    case 'cv': R.si[k].v = t.value; break;
    default: return;
  }
  sauver(['add', 'rc-on', 'rf-on', 'rct', 'cc', 'co', 'cn-on', 'cw-on', 'rbt', 'rbs', 'eh-txt-on', 'rd-on'].includes(a) || (a === 'eh' && t.dataset.f === 'fond') || (a === 'et' && ['couleur', 'contenu', 'bord'].includes(t.dataset.f)) || ((a === 'fl' || a === 'cq') && t.dataset.f === 'type'));
});
modal.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.regle') && cfg.regles[+d.dataset.r]) cfg.regles[+d.dataset.r].o = d.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('ouvert'); });
function boutonSecours() {
  const z = document.getElementById('cfg-secours'); if (!z || !peutModifier) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = '⚙ Configurer le widget'; b.addEventListener('click', ouvrirReglages); z.appendChild(b);
}
if (/[?&]config=1/.test(location.search)) boutonSecours();   // secours : ajouter ?config=1 à l'adresse du widget
</script>
</body>
