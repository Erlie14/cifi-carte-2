<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIFI – Carte des contrôles</title>

<!--
  Les bibliothèques sont chargées depuis le dossier "lib" (aucun site tiers).
  Si le dossier lib est vide, exécutez telecharger-libs.ps1 (Windows) ou telecharger-libs.sh (Linux/Mac). Voir LISEZMOI.md.
  grist-plugin-api.js est fourni par Grist lui-même : changez l'adresse si votre instance est différente.
-->
<link rel="stylesheet" href="./lib/leaflet.css">
<link rel="stylesheet" href="./lib/MarkerCluster.css">
<link rel="stylesheet" href="./lib/MarkerCluster.Default.css">
<script src="./lib/leaflet.js"></script>
<script src="./lib/leaflet.markercluster.js"></script>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>

<style>
  :root { --ink:#1d2733; --muted:#5d6b7a; --paper:#fff; --line:#dde3ea; --accent:#1f4e8c; }
  html, body { height:100%; margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  #map { height:100%; width:100%; }
  #msg { position:absolute; inset:0; z-index:1000; display:none; align-items:center; justify-content:center;
         background:rgba(255,255,255,.95); padding:24px; text-align:center; line-height:1.5; font-size:15px; }

  /* Marqueurs : couleur + forme + lettre */
  .pin { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #0007;
         display:flex; align-items:center; justify-content:center; font:700 12px/1 system-ui,sans-serif; color:#fff; box-sizing:border-box; }
  .pin.moyen { color:#1d2733; border-radius:7px; }
  .pin.eleve { border-radius:7px; transform:rotate(45deg); }
  .pin.eleve span { transform:rotate(-45deg); }
  .pin.critique { box-shadow:0 0 0 4px #c1121f55, 0 0 0 1px #0007; }
  .pin.sel { outline:3px solid var(--accent); outline-offset:3px; }

  /* Panneaux */
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px #0002; padding:10px; font-size:13px; }
  .panel input[type=search] { width:210px; box-sizing:border-box; padding:7px 9px; font:inherit; border:1px solid var(--line); border-radius:6px; }
  .panel .count { margin-top:6px; color:var(--muted); line-height:1.4; }
  .panel button.link { margin-top:4px; padding:0; border:0; background:none; color:var(--accent); font:inherit; cursor:pointer; text-decoration:underline; }
  .legend button { display:flex; align-items:center; gap:8px; width:100%; padding:5px 6px; margin:1px 0; font:inherit; text-align:left;
                   background:none; border:1px solid transparent; border-radius:6px; cursor:pointer; color:var(--ink); }
  .legend button:hover { background:#f1f4f8; }
  .legend button[aria-pressed=false] { opacity:.45; text-decoration:line-through; }
  .legend strong { display:block; margin-bottom:4px; }
  .legend i { flex:none; width:13px; height:13px; border:1px solid #0006; }
  .b-faible { background:#2a9d8f; border-radius:50%; } .b-moyen { background:#e9c46a; border-radius:3px; }
  .b-eleve { background:#f4821f; transform:rotate(45deg) scale(.85); } .b-critique { background:#c1121f; border-radius:50%; box-shadow:0 0 0 2px #c1121f55; }
  .b-neutre { background:#6b7785; border-radius:50%; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid #f4821f; outline-offset:2px; }

  /* Popup pliable */
  .cifi-popup .leaflet-popup-content-wrapper { border-radius:12px; padding:0; overflow:hidden; }
  .cifi-popup .leaflet-popup-content { margin:0; width:300px !important; }
  .fiche header { padding:12px 14px 10px; border-left:6px solid var(--niv); background:#f6f8fb; }
  .fiche h3 { margin:0 0 6px; font-size:15px; line-height:1.3; }
  .fiche .niv { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; border:1px solid #0003; }
  .fiche .corps { max-height:260px; overflow:auto; }
  .fiche details { border-top:1px solid var(--line); }
  .fiche summary { padding:9px 14px; cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .fiche summary::-webkit-details-marker { display:none; }
  .fiche summary::after { content:"▾"; color:var(--muted); transition:transform .15s; }
  .fiche details[open] summary::after { transform:rotate(180deg); }
  .fiche dl { margin:0; padding:0 14px 10px; display:grid; grid-template-columns:minmax(80px,38%) minmax(0,1fr); gap:4px 10px; font-size:13px; }
  .fiche dt { color:var(--muted); } .fiche dd { margin:0; overflow-wrap:anywhere; }
  .fiche .pied { padding:10px 14px; border-top:1px solid var(--line); }
  .fiche .pied button { padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:var(--accent); color:#fff; border:0; border-radius:6px; }
  /* Volet « fiche complète » */
  #fiche-panel { position:absolute; top:0; right:0; bottom:0; width:min(400px,100%); z-index:1100; background:var(--paper);
    box-shadow:-4px 0 18px #0003; display:flex; flex-direction:column; transform:translateX(105%); visibility:hidden;
    transition:transform .2s ease, visibility .2s; }
  #fiche-panel.ouvert { transform:none; visibility:visible; }
  .fp-tete { position:relative; padding:16px 52px 14px 18px; border-left:8px solid var(--niv); background:#f6f8fb; border-bottom:1px solid var(--line); }
  .fp-tete h2 { margin:0 0 8px; font-size:18px; line-height:1.3; }
  .fp-tete .niv { display:inline-block; padding:3px 12px; border-radius:12px; font-size:13px; font-weight:600; border:1px solid #0003; }
  .fp-fermer { position:absolute; top:10px; right:10px; width:34px; height:34px; border:1px solid var(--line); border-radius:50%;
    background:#fff; font-size:16px; cursor:pointer; color:var(--ink); }
  .fp-fermer:hover { background:#eef2f7; }
  .fp-corps { flex:1; overflow:auto; padding:14px 18px; }
  .fp-corps dl { margin:0; display:grid; grid-template-columns:minmax(100px,38%) minmax(0,1fr); gap:10px 12px; font-size:14px; }
  .fp-corps dt { color:var(--muted); } .fp-corps dd { margin:0; overflow-wrap:anywhere; }
  .fp-corps details.theme { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .fp-corps summary { padding:10px 14px; cursor:pointer; font-weight:600; font-size:14px; list-style:none; display:flex; align-items:center; gap:8px; background:#f6f8fb; }
  .fp-corps summary::-webkit-details-marker { display:none; }
  .fp-corps summary::after { content:"▾"; margin-left:auto; color:var(--muted); transition:transform .15s; }
  .fp-corps details[open] > summary::after { transform:rotate(180deg); }
  .fp-corps summary .nb { font-weight:400; font-size:12px; color:var(--muted); }
  .fp-corps details.theme dl { padding:12px 14px 4px; }
  .fp-outils { text-align:right; margin-bottom:8px; }
  .fp-outils button { padding:0; border:0; background:none; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; text-decoration:underline; }
  .fiche .corps dl { padding-top:10px; }
  .b { font-weight:700; }
  .fiche dt, .fp-corps dt, .fiche dd, .fp-corps dd { min-width:0; overflow-wrap:anywhere; }
  dt.b { color:var(--ink); } dd.i { font-style:italic; }
  .badge { display:inline-block; padding:1px 9px; border-radius:10px; background:#e8eef7; border:1px solid #c9d6ea; }
  .rg-corps li { flex-direction:column; align-items:stretch; border-bottom:1px solid #eef1f5; padding:6px 0; }
  .rg-l1, .rg-l2 { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .rg-l2 input[type=text] { flex:1; min-width:120px; }
  .rg-corps .nomcol small { color:var(--muted); }
  #reglages { position:absolute; inset:0; z-index:1200; background:#0006; display:none; align-items:center; justify-content:center; padding:12px; }
  #reglages.ouvert { display:flex; }
  .rg-boite { background:#fff; border-radius:12px; width:min(620px,100%); max-height:100%; display:flex; flex-direction:column; box-shadow:0 8px 30px #0005; }
  .rg-tete { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  .rg-tete h2 { margin:0; font-size:17px; }
  .rg-corps { overflow:auto; padding:6px 18px 18px; }
  .rg-corps section { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:12px; }
  .rg-corps h3 { margin:0 0 8px; font-size:14px; }
  .rg-corps ul { list-style:none; margin:0 0 8px; padding:0; }
  .rg-corps li { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:13px; }
  .rg-corps .nomcol { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .rg-corps button, .rg-tete button { font:inherit; font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .rg-corps select, .rg-corps input[type=text] { font:inherit; font-size:13px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; max-width:100%; }
  .rg-sec { display:flex; gap:6px; margin-bottom:8px; } .rg-sec input { flex:1; font-weight:600; }
  .rg-ajout { margin-top:12px; background:var(--accent) !important; color:#fff; border-color:var(--accent) !important; padding:7px 12px !important; font-size:13px !important; }
  .fp-corps .vide { color:var(--muted); }
  .fp-pied { padding:12px 18px; border-top:1px solid var(--line); }
  .fp-pied button { padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:6px; }
  @media (prefers-reduced-motion:reduce) { #fiche-panel { transition:none; } }
  @media (prefers-reduced-motion:reduce) { .fiche summary::after { transition:none; } }
  .pin.sombre { color:#1d2733; } .pin.f-rond { border-radius:50%; } .pin.f-carre { border-radius:7px; }
  .pin.f-losange { border-radius:7px; transform:rotate(45deg); } .pin.f-losange span { transform:rotate(-45deg); }
  .pin.f-triangle { border-radius:0; border:0; clip-path:polygon(50% 4%,98% 92%,2% 92%); padding-top:7px; box-shadow:none; }
  .legend .sep { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
  #filtres label { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
  #filtres select { display:block; width:210px; margin-top:2px; padding:5px; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:6px; }
  .rg-corps label { display:block; margin:8px 0; font-size:13px; } .rg-corps label select, .rg-corps label input[type=number] { margin-left:6px; }
  .rg-corps .rg-sec { margin-bottom:6px; } .rg-corps .rg-sec input { width:100%; }
  .leaflet-top.leaflet-left .panel { max-height:72vh; overflow:auto; }
  .leaflet-tooltip.nom-etab { display:none; font:600 12px system-ui,sans-serif; border:1px solid #0004; padding:2px 6px; }
  .noms-on .leaflet-tooltip.nom-etab { display:block; }
  #compteurs { margin-top:6px; line-height:1.5; } #compteurs strong { font-size:16px; color:var(--accent); }
  #filtres details { margin-top:6px; border:1px solid var(--line); border-radius:6px; }
  #filtres summary { padding:5px 8px; cursor:pointer; font-size:13px; }
  #filtres details label { display:block; margin:0; padding:2px 10px; color:var(--ink); font-size:13px; }
  #filtres .liste { max-height:160px; overflow:auto; padding-bottom:4px; }
  .rg-corps label input[type=text] { width:100%; margin:4px 0 0; box-sizing:border-box; }
  .leaflet-top.leaflet-left .panel { width:250px; box-sizing:border-box; max-height:calc(100vh - 24px); overflow:auto; }
  .panel input[type=search] { width:100%; }
  .panel hr { border:0; border-top:1px solid var(--line); margin:8px 0; }
  #liste { max-height:220px; overflow:auto; margin-top:6px; border:1px solid var(--line); border-radius:6px; }
  #liste button { display:flex; align-items:center; gap:7px; width:100%; padding:5px 8px; font:inherit; font-size:13px; text-align:left; background:none; border:0; border-bottom:1px solid #eef1f5; cursor:pointer; color:var(--ink); }
  #liste button:hover { background:#f1f4f8; } #liste i { flex:none; width:10px; height:10px; border-radius:50%; border:1px solid #0005; }
  .legend { margin-top:8px; } .legend .sw { flex:none; width:18px; text-align:center; font-size:15px; line-height:1; }
  .rg-onglets { display:flex; gap:6px; padding:8px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .rg-onglets button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:16px; background:#fff; cursor:pointer; }
  .rg-onglets button[aria-pressed=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rg-sous { font-size:12px; font-weight:700; color:var(--muted); margin:8px 0 2px; text-transform:uppercase; }
  .rg-l2 select { max-width:100%; } .rg-corps input[type=color] { width:38px; height:28px; padding:0; border:1px solid var(--line); border-radius:6px; }
  .pin.f-goutte { border-radius:50% 50% 50% 0; transform:rotate(-45deg); } .pin.f-goutte span { transform:rotate(45deg); }
  .legend .gt { display:inline-block; width:11px; height:11px; border:1px solid #0006; border-radius:50% 50% 50% 0; transform:rotate(-45deg); }
  .legend button.titre { width:auto; } .legend button.titre strong { display:inline; margin:0; }
  .cpt-t { font-weight:700; margin-top:6px; font-size:12px; color:var(--muted); text-transform:uppercase; }
  .rg-etat { font-size:12px; color:var(--muted); margin:0 10px 0 auto; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg"></div>
<aside id="fiche-panel" aria-label="Fiche de l’établissement" aria-hidden="true"></aside>

<script>
const VERSION = '15';
const peutModifier = !/[?&]readonly=(1|true)/i.test(location.search);
const FORMES = ['rond','goutte','carre','losange','triangle'], FORMES_LIB = { rond:'Rond', goutte:'Goutte', carre:'Carré', losange:'Losange', triangle:'Triangle' }, SYMBOLES = { rond:'●', carre:'■', losange:'◆', triangle:'▲' };
const swatch = (f, c) => f === 'goutte' ? `<span class="sw"><i class="gt" style="background:${c}"></i></span>` : `<span class="sw" style="color:${c}">${SYMBOLES[f] || '●'}</span>`;
const STYLES = { '':'Valeur normale', 'b':'Valeur en gras', 'i':'Valeur en italique', 'badge':'Valeur en pastille' };
const OPS = [['=','est égal à'],['≠','est différent de'],['contient','contient'],['>','est supérieur à'],['<','est inférieur à'],['vide','est vide'],['rempli','n’est pas vide']];
const DEFAUT = { couleur:'#1f4e8c', forme:'rond' };

const geopf = (l, f) => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${f}&LAYER=${l}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const fonds = {
  'Plan IGN': L.tileLayer(geopf('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'), { maxZoom:19, attribution:'© IGN – Géoplateforme' }),
  'Photographies aériennes': L.tileLayer(geopf('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'), { maxZoom:19, attribution:'© IGN – Géoplateforme' }),
};

/* ================= OUTILS ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sansAccent = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const joli = k => String(k).replace(/_/g,' ').replace(/^./, c => c.toUpperCase());
function formater(k, v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) { if (isNaN(v)) return null; const m = !v.getUTCHours() && !v.getUTCMinutes() && !v.getUTCSeconds(); return m ? v.toLocaleDateString('fr-FR',{timeZone:'UTC'}) : v.toLocaleString('fr-FR'); }
  if (typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if (Array.isArray(v)) return v.filter(x => x !== 'L').join(', ') || null;
  if (typeof v === 'object') return null;
  return String(v);
}
function sombre(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return false; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 170; }
const afficherMsg = h => { const m = document.getElementById('msg'); m.innerHTML = h; m.style.display = h ? 'flex' : 'none'; };

/* ================= ÉTAT ================= */
const nEntree = x => ({ c:x.c, nom:x.nom || '', gn:x.gn ?? !!x.gras, vs:x.vs || '' });
const nRegle = r => ({ nom:r.nom || '', si:(r.si || []).map(k => ({ c:k.c || '', op:k.op || '=', v:k.v ?? '' })), couleur:r.couleur || '', forme:r.forme || '',
  contenu:{ t:(r.contenu && r.contenu.t) || '', e:(r.contenu && r.contenu.e) || '', c:(r.contenu && r.contenu.c) || '' } });
const norm = c => { c = c || {}; return { popup:(c.popup || []).map(nEntree), sections:(c.sections || []).map(s => ({ nom:s.nom || '', cols:(s.cols || []).map(nEntree) })), regles:(c.regles || []).map(nRegle), defaut:{ ...DEFAUT, ...(c.defaut || {}) } }; };
let opts = {}, cfg = norm(), lastRec = null, lastMap = null, labels = {}, types = {}, allCols = [], donnees = new Map(), tid = null, erreurAcces = '', labelsCharges = false;
let recherche = '', premierChargement = true, idSelectionne = null, ficheId = null, sansGps = 0, regroupPrec = true, sigFiltres = '', listeOuverte = false, cptCols = [], sigAff = '', legOuverte = true, legCats = [];
const marqueurs = new Map(), masques = new Set(), filtreSel = {}, etatSections = new Map();
const opt = (n, d) => (opts[n] === undefined || opts[n] === null || opts[n] === '') ? d : opts[n];
const libel = c => labels[c] || joli(c);
function fmt(c, v) {
  const t = types[c] || '';
  if (typeof v === 'number' && t === 'Date') return new Date(v * 1000).toLocaleDateString('fr-FR', { timeZone:'UTC' });
  if (typeof v === 'number' && t.startsWith('DateTime')) return new Date(v * 1000).toLocaleString('fr-FR');
  return formater(c, v);
}

/* ================= RÈGLES D'AFFICHAGE DES POINTS ================= */
function numDe(c, v) { if (v instanceof Date) return v.getTime(); const t = types[c] || ''; if (typeof v === 'number') return (t === 'Date' || t.startsWith('DateTime')) ? v * 1000 : v; return null; }
function numSaisie(s) {
  s = String(s).trim().replace(',', '.'); if (s !== '' && !isNaN(Number(s))) return Number(s);
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1]);
  const d = Date.parse(s); return isNaN(d) ? null : d;
}
function test(k, vals) {
  const raw = vals[k.c], f = fmt(k.c, raw), t = sansAccent(f ?? '').trim(), a = sansAccent(k.v ?? '').trim();
  switch (k.op) {
    case '=': return t === a; case '≠': return t !== a; case 'contient': return t.includes(a);
    case 'vide': return f === null; case 'rempli': return f !== null;
    case '>': case '<': { const x = numDe(k.c, raw), y = numSaisie(k.v); if (x === null || y === null) return false; return k.op === '>' ? x > y : x < y; }
  }
  return false;
}
const regleActive = r => r.si.length && r.si.every(k => k.c);
const nomRegle = r => r.nom.trim() || (r.si[0] && r.si[0].c ? `${libel(r.si[0].c)} ${(OPS.find(o => o[0] === r.si[0].op) || [])[0] || ''} ${r.si[0].v || ''}`.trim() : 'Règle');
function styleDe(vals) {
  let couleur = null, forme = null, contenu = null, cat = -1;
  cfg.regles.forEach((r, i) => {
    if (!regleActive(r) || !r.si.every(k => test(k, vals))) return;
    if (cat < 0) cat = i;
    if (couleur === null && r.couleur) couleur = r.couleur;
    if (forme === null && r.forme) forme = r.forme;
    if (contenu === null && r.contenu.t) contenu = r.contenu.t === 'emoji' ? r.contenu.e : (r.contenu.c ? String(fmt(r.contenu.c, vals[r.contenu.c]) ?? '').slice(0, 6) : '');
  });
  return { couleur: couleur || cfg.defaut.couleur, forme: forme || cfg.defaut.forme, contenu: contenu || '', cat };
}

/* ================= CARTE ET PANNEAU DE GAUCHE ================= */
const map = L.map('map', { center:[46.6,2.5], zoom:6, layers:[fonds['Plan IGN']] });
L.control.layers(fonds, null, { position:'topright' }).addTo(map);
L.control.scale({ metric:true, imperial:false }).addTo(map);
const cluster = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius: () => opt('regrouper', true) === false ? 0 : 45 });
map.addLayer(cluster);

const haut = L.control({ position:'topleft' });
haut.onAdd = () => {
  const d = L.DomUtil.create('div', 'panel');
  d.innerHTML = `<input type="search" id="q" placeholder="Rechercher un nom…" aria-label="Rechercher un établissement">
    <div id="filtres"></div><div id="compteurs"></div><div class="count" id="count"></div>
    <button class="link" id="liste-btn" type="button" aria-expanded="false">Afficher la liste des établissements</button><div id="liste" style="display:none"></div><br>
    <button class="link" id="tout" type="button">Voir tous les points</button><div class="legend" id="legende"></div><div id="cfg-secours"></div>`;
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  d.querySelector('#q').addEventListener('input', e => { recherche = sansAccent(e.target.value.trim()); appliquerFiltres(); });
  d.querySelector('#tout').addEventListener('click', recentrer);

/* ================= GRIST ================= */
grist.ready({
  requiredAccess: 'full',   // nécessaire pour lister toutes les colonnes : à n'utiliser qu'avec un widget hébergé sur un serveur de confiance
  allowSelectBy: true,
  onEditOptions: () => ouvrirReglages(),   // fait apparaître le bouton « Ouvrir la configuration » dans le panneau de droite de Grist

grist.onOptions(o => { if (modal.classList.contains('ouvert')) return; opts = o || {}; cfg = norm(opts.cfg); if (lastRec) construire(); });

  if (!allCols.length) allCols = Object.keys(records[0] || {}).filter(k => k !== 'id' && k !== 'manualSort');

async function maj() { if (!labelsCharges) await chargerLibelles(); else await chargerTable(); construire(); }
async function chargerLibelles() {
  labelsCharges = true;
  try {
    tid = await grist.selectedTable.getTableId();
    const T = await grist.docApi.fetchTable('_grist_Tables'), C = await grist.docApi.fetchTable('_grist_Tables_column'), ref = T.id[T.tableId.indexOf(tid)];
    C.id.forEach((_, k) => { if (C.parentId[k] === ref) { labels[C.colId[k]] = C.label[k]; types[C.colId[k]] = C.type[k]; } });
  } catch (e) { console.warn('Libellés indisponibles', e); }

async function chargerTable() {

    const t = await grist.docApi.fetchTable(tid), cols = Object.keys(t).filter(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper_')), m = new Map();

function construire() {
  if (!lastRec) return;
  const mapped = grist.mapColumnNames(lastRec), m = lastMap;
  if (!mapped || !m) { afficherMsg('<div><strong>Associez les colonnes</strong><br>Dans le panneau de droite, indiquez le nom, la latitude et la longitude.</div>'); return; }
  afficherMsg('');
  const cFil = [].concat(m.filtres || []).filter(Boolean); cptCols = [].concat(m.compteurs || []).filter(Boolean);
  const cTous = [...new Set([...cFil, ...cptCols])];
  const vus = new Set(), presents = new Set(); sansGps = 0;
  lastRec.forEach((raw, i) => {
    const r = mapped[i], lat = Number(r.lat), lng = Number(r.lng);
    if (r.lat == null || r.lng == null || r.lat === '' || r.lng === '' || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) { sansGps++; return; }
    const vals = donnees.get(raw.id) || raw, fv = {};
    cTous.forEach(c => { fv[c] = fmt(c, vals[c]) ?? '(vide)'; });
    const d = { id:raw.id, nom:r.nom, vals, fv, style:styleDe(vals) };

    else {
      mk = L.marker([lat, lng], { title:r.nom || '', keyboard:true });
      mk.bindPopup(() => fichier(mk._cifi), { maxWidth:320, className:'cifi-popup' });
      mk.on('click', () => grist.setSelectedRows([raw.id]));
      marqueurs.set(raw.id, mk);

    mk._cifi = d; mk.setIcon(icone(d, raw.id === idSelectionne));
    if (mk.isPopupOpen()) mk.getPopup().update();

  legCats = cfg.regles.map((r, i) => ({ i, r })).filter(x => regleActive(x.r) && presents.has(x.i)).map(x => ({ k:'r' + x.i, label:nomRegle(x.r), couleur:x.r.couleur || cfg.defaut.couleur, forme:x.r.forme || cfg.defaut.forme, emoji:x.r.contenu.t === 'emoji' ? x.r.contenu.e : '' }));
  if (legCats.length && presents.has(-1)) legCats.push({ k:'r-1', label:'Autres', couleur:cfg.defaut.couleur, forme:cfg.defaut.forme, emoji:'' });
  majLegende();

  const valsDe = c => [...new Set([...marqueurs.values()].map(x => x._cifi.fv[c]))].filter(v => v !== undefined).sort((a, b) => String(a).localeCompare(String(b), 'fr')).slice(0, 200);
  const sig = JSON.stringify(cFil.map(c => [c, valsDe(c)]));
  Object.keys(filtreSel).forEach(c => { if (!cFil.includes(c)) delete filtreSel[c]; else filtreSel[c] = (filtreSel[c] || []).filter(v => valsDe(c).includes(v)); });
  if (sig !== sigFiltres) {
    sigFiltres = sig;
    document.getElementById('filtres').innerHTML = cFil.map(c => { const sl = new Set(filtreSel[c] || []);
      return `<details${sl.size ? ' open' : ''}><summary>${esc(libel(c))}${sl.size ? ` (${sl.size})` : ''}</summary><div class="liste">${valsDe(c).map(v => `<label><input type="checkbox" data-c="${esc(c)}" value="${esc(v)}"${sl.has(v) ? ' checked' : ''}> ${esc(v)}</label>`).join('')}</div></details>`; }).join('');

}

  if (onglet === 'popup') return `<section><h3>Colonnes du popup (clic sur un point)</h3>${blocListe('p')}</section>`;
  if (onglet === 'fiche') return cfg.sections.map((sec, i) => `<section><div class="rg-sec"><input type="text" value="${esc(sec.nom)}" data-a="nom" data-g="${i}" aria-label="Nom de la section" placeholder="Nom de la section">${btn('sup', `data-g="${i}"`, '▲', 'Monter')}${btn('sdown', `data-g="${i}"`, '▼', 'Descendre')}${btn('sdel', `data-g="${i}"`, 'Supprimer')}</div>${blocListe(String(i))}</section>`).join('') + '<button type="button" class="rg-ajout" data-a="sadd">+ Ajouter une section</button>';
  const sl = (n, ch) => `<select data-o="${n}">${ch.map(c => `<option${opt(n, ch[0]) === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  const elts = [['q', 'Recherche par nom'], ['filtres', 'Filtres'], ['compteurs', 'Compteurs'], ['liste', 'Liste des établissements'], ['tout', 'Bouton « Voir tous les points »'], ['legende', 'Légende']];
  return `<section><h3>Éléments du panneau de gauche</h3><p class="vide" style="font-size:12px;margin:0 0 4px">Cochez les éléments à proposer à vos utilisateurs. La liste et la légende peuvent aussi être dépliées ou repliées par défaut.</p>
    ${elts.map(([k, t]) => `<label><input type="checkbox" data-o="aff_${k}"${opt('aff_' + k, true) !== false ? ' checked' : ''}> ${t} affiché${k === 'liste' || k === 'legende' ? `<span style="margin-left:18px"><input type="checkbox" data-o="ouv_${k}"${(k === 'liste' ? opt('ouv_liste', false) === true : opt('ouv_legende', true) !== false) ? ' checked' : ''}> déplié par défaut</span>` : ''}</label>`).join('')}</section>
    <section><h3>Fiche et points</h3><label>Sections dépliées à l’ouverture ${sl('ouverture', ['Première section', 'Toutes', 'Aucune'])}</label>
    <label><input type="checkbox" data-o="regrouper"${opt('regrouper', true) !== false ? ' checked' : ''}> Regrouper les points proches</label>
    <label>Taille des points <input type="number" min="16" max="48" data-o="taille" value="${+opt('taille', 30)}"> px</label></section>`;
}
function dessiner() {
  const y = (modal.querySelector('.rg-corps') || {}).scrollTop || 0;
  modal.innerHTML = `<div class="rg-boite" role="dialog" aria-label="Configurer le widget"><div class="rg-tete"><h2>Configurer le widget</h2><span id="rg-etat" class="rg-etat">${esc(etatSauv)}</span>${btn('fermer', '', 'Fermer')}</div>
    <div class="rg-onglets">${[['points', 'Affichage des points'], ['popup', 'Popup'], ['fiche', 'Fiche'], ['general', 'Général']].map(([k, t]) => `<button type="button" data-a="onglet" data-t="${k}" aria-pressed="${onglet === k}">${t}</button>`).join('')}</div>
    <div class="rg-corps">${erreurAcces ? `<p style="color:#c1121f;font-size:13px">Impossible de lire toutes les colonnes : vérifiez que le widget est en « Accès complet » dans le panneau de droite de Grist.</p>` : ''}${contenuOnglet()}</div></div>`;
  modal.querySelector('.rg-corps').scrollTop = y;
}
function ouvrirReglages() { dessiner(); modal.classList.add('ouvert'); }
function etat(t) { etatSauv = t; const e = document.getElementById('rg-etat'); if (e) e.textContent = t; }
function enregistrer() {
  clearTimeout(minuteur); etat('Enregistrement…');
  minuteur = setTimeout(() => {
    opts.cfg = cfg;
    Promise.resolve().then(() => grist.setOptions ? grist.setOptions(opts) : grist.setOption('cfg', cfg))
      .then(() => etat('✓ Enregistré')).catch(e => etat('⚠ Non enregistré : ' + ((e && e.message) || e)));
  }, 300);
}
function sauver(redessiner = true) { enregistrer(); construire(); if (redessiner) dessiner(); }
modal.addEventListener('click', e => {
  if (e.target === modal) { modal.classList.remove('ouvert'); return; }
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a, g = b.dataset.g, i = +b.dataset.i, r = +b.dataset.r, k = +b.dataset.k;
  switch (a) {
    case 'fermer': modal.classList.remove('ouvert'); return;
    case 'onglet': onglet = b.dataset.t; dessiner(); return;
    case 'up': case 'down': deplacer(listeDe(g), i, a === 'up' ? -1 : 1); break;
    case 'del': listeDe(g).splice(i, 1); break;
    case 'sup': case 'sdown': deplacer(cfg.sections, +g, a === 'sup' ? -1 : 1); break;
    case 'sdel': if (!confirm('Supprimer cette section ?')) return; cfg.sections.splice(+g, 1); break;
    case 'sadd': cfg.sections.push({ nom:'Nouvelle section', cols:[] }); break;
    case 'radd': cfg.regles.push(nRegle({ si:[{ c:'', op:'=', v:'' }], couleur:'#c1121f' })); break;
    case 'rup': case 'rdown': deplacer(cfg.regles, r, a === 'rup' ? -1 : 1); break;
    case 'rdel': cfg.regles.splice(r, 1); break;
    case 'cadd': cfg.regles[r].si.push({ c:'', op:'=', v:'' }); break;
    case 'cdel': cfg.regles[r].si.splice(k, 1); break;
    default: return;
  }
  sauver();
});
modal.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.o) {
    const n = t.dataset.o, v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.min(48, Math.max(16, +t.value || 30)) : t.value;
    opts[n] = v; construire(); enregistrer(); return;
  }
  const a = t.dataset.a; if (!a) return;
  const g = t.dataset.g, i = +t.dataset.i, r = +t.dataset.r, k = +t.dataset.k, R = cfg.regles[r];
  switch (a) {
    case 'add': if (t.value) listeDe(g).push({ c:t.value, nom:'', gn:false, vs:'' }); break;
    case 'lib': listeDe(g)[i].nom = t.value; break;
    case 'gn': listeDe(g)[i].gn = t.checked; break;
    case 'vs': listeDe(g)[i].vs = t.value; break;
    case 'nom': cfg.sections[+g].nom = t.value; break;
    case 'defc': cfg.defaut.couleur = t.value; break;
    case 'deff': cfg.defaut.forme = t.value; break;
    case 'rnom': R.nom = t.value; break;
    case 'rc-on': R.couleur = t.checked ? '#c1121f' : ''; break;
    case 'rc': R.couleur = t.value; break;
    case 'rf-on': R.forme = t.checked ? 'rond' : ''; break;
    case 'rf': R.forme = t.value; break;
    case 'rct': R.contenu.t = t.value; break;
    case 're': R.contenu.e = t.value; break;
    case 'rcc': R.contenu.c = t.value; break;
    case 'cc': R.si[k].c = t.value; break;
    case 'co': R.si[k].op = t.value; break;
    case 'cv': R.si[k].v = t.value; break;
    default: return;
  }
  sauver(['add', 'rc-on', 'rf-on', 'rct', 'cc', 'co'].includes(a));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('ouvert'); });
function boutonSecours() {
  const z = document.getElementById('cfg-secours'); if (!z || !peutModifier) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = '⚙ Configurer le widget'; b.addEventListener('click', ouvrirReglages); z.appendChild(b);
}
if (/[?&]config=1/.test(location.search)) boutonSecours();   // secours : ajouter ?config=1 à l'adresse du widget
</script>
</body>
</html>
