<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIFI – Carte des contrôles</title>

<!--
  Les bibliothèques sont chargées depuis le dossier "lib" (aucun site tiers).
  Si le dossier lib est vide, exécutez telecharger-libs.ps1 (Windows) ou telecharger-libs.sh (Linux/Mac). Voir LISEZMOI.md.
  grist-plugin-api.js est fourni par Grist lui-même : changez l'adresse si votre instance est différente.
-->
<link rel="stylesheet" href="./lib/leaflet.css">
<link rel="stylesheet" href="./lib/MarkerCluster.css">
<link rel="stylesheet" href="./lib/MarkerCluster.Default.css">
<script src="./lib/leaflet.js"></script>
<script src="./lib/leaflet.markercluster.js"></script>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>

<style>
  :root { --ink:#1d2733; --muted:#5d6b7a; --paper:#fff; --line:#dde3ea; --accent:#1f4e8c; }
  html, body { height:100%; margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  #map { height:100%; width:100%; }
  #msg { position:absolute; inset:0; z-index:1000; display:none; align-items:center; justify-content:center;
         background:rgba(255,255,255,.95); padding:24px; text-align:center; line-height:1.5; font-size:15px; }

  /* Marqueurs : couleur + forme + lettre */
  .pin { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #0007;
         display:flex; align-items:center; justify-content:center; font:700 12px/1 system-ui,sans-serif; color:#fff; box-sizing:border-box; }
  .pin.moyen { color:#1d2733; border-radius:7px; }
  .pin.eleve { border-radius:7px; transform:rotate(45deg); }
  .pin.eleve span { transform:rotate(-45deg); }
  .pin.critique { box-shadow:0 0 0 4px #c1121f55, 0 0 0 1px #0007; }
  .pin.sel { outline:3px solid var(--accent); outline-offset:3px; }

  /* Panneaux */
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px #0002; padding:10px; font-size:13px; }
  .panel input[type=search] { width:210px; box-sizing:border-box; padding:7px 9px; font:inherit; border:1px solid var(--line); border-radius:6px; }
  .panel .count { margin-top:6px; color:var(--muted); line-height:1.4; }
  .panel button.link { margin-top:4px; padding:0; border:0; background:none; color:var(--accent); font:inherit; cursor:pointer; text-decoration:underline; }
  .legend button { display:flex; align-items:center; gap:8px; width:100%; padding:5px 6px; margin:1px 0; font:inherit; text-align:left;
                   background:none; border:1px solid transparent; border-radius:6px; cursor:pointer; color:var(--ink); }
  .legend button:hover { background:#f1f4f8; }
  .legend button[aria-pressed=false] { opacity:.45; text-decoration:line-through; }
  .legend strong { display:block; margin-bottom:4px; }
  .legend i { flex:none; width:13px; height:13px; border:1px solid #0006; }
  .b-faible { background:#2a9d8f; border-radius:50%; } .b-moyen { background:#e9c46a; border-radius:3px; }
  .b-eleve { background:#f4821f; transform:rotate(45deg) scale(.85); } .b-critique { background:#c1121f; border-radius:50%; box-shadow:0 0 0 2px #c1121f55; }
  .b-neutre { background:#6b7785; border-radius:50%; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid #f4821f; outline-offset:2px; }

  /* Popup pliable */
  .cifi-popup .leaflet-popup-content-wrapper { border-radius:12px; padding:0; overflow:hidden; }
  .cifi-popup .leaflet-popup-content { margin:0; width:300px !important; }
  .fiche header { padding:12px 14px 10px; border-left:6px solid var(--niv); background:#f6f8fb; }
  .fiche h3 { margin:0 0 6px; font-size:15px; line-height:1.3; }
  .fiche .niv { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; border:1px solid #0003; }
  .fiche .corps { max-height:260px; overflow:auto; }
  .fiche details { border-top:1px solid var(--line); }
  .fiche summary { padding:9px 14px; cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .fiche summary::-webkit-details-marker { display:none; }
  .fiche summary::after { content:"▾"; color:var(--muted); transition:transform .15s; }
  .fiche details[open] summary::after { transform:rotate(180deg); }
  .fiche dl { margin:0; padding:0 14px 10px; display:grid; grid-template-columns:minmax(80px,38%) minmax(0,1fr); gap:4px 10px; font-size:13px; }
  .fiche dt { color:var(--muted); } .fiche dd { margin:0; overflow-wrap:anywhere; }
  .fiche .pied { padding:10px 14px; border-top:1px solid var(--line); }
  .fiche .pied button { padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:var(--accent); color:#fff; border:0; border-radius:6px; }
  /* Volet « fiche complète » */
  #fiche-panel { position:absolute; top:0; right:0; bottom:0; width:min(400px,100%); z-index:1100; background:var(--paper);
    box-shadow:-4px 0 18px #0003; display:flex; flex-direction:column; transform:translateX(105%); visibility:hidden;
    transition:transform .2s ease, visibility .2s; }
  #fiche-panel.ouvert { transform:none; visibility:visible; }
  .fp-tete { position:relative; padding:16px 52px 14px 18px; border-left:8px solid var(--niv); background:#f6f8fb; border-bottom:1px solid var(--line); }
  .fp-tete h2 { margin:0 0 8px; font-size:18px; line-height:1.3; }
  .fp-tete .niv { display:inline-block; padding:3px 12px; border-radius:12px; font-size:13px; font-weight:600; border:1px solid #0003; }
  .fp-fermer { position:absolute; top:10px; right:10px; width:34px; height:34px; border:1px solid var(--line); border-radius:50%;
    background:#fff; font-size:16px; cursor:pointer; color:var(--ink); }
  .fp-fermer:hover { background:#eef2f7; }
  .fp-corps { flex:1; overflow:auto; padding:14px 18px; }
  .fp-corps dl { margin:0; display:grid; grid-template-columns:minmax(100px,38%) minmax(0,1fr); gap:10px 12px; font-size:14px; }
  .fp-corps dt { color:var(--muted); } .fp-corps dd { margin:0; overflow-wrap:anywhere; }
  .fp-corps details.theme { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .fp-corps summary { padding:10px 14px; cursor:pointer; font-weight:600; font-size:14px; list-style:none; display:flex; align-items:center; gap:8px; background:#f6f8fb; }
  .fp-corps summary::-webkit-details-marker { display:none; }
  .fp-corps summary::after { content:"▾"; margin-left:auto; color:var(--muted); transition:transform .15s; }
  .fp-corps details[open] > summary::after { transform:rotate(180deg); }
  .fp-corps summary .nb { font-weight:400; font-size:12px; color:var(--muted); }
  .fp-corps details.theme dl { padding:12px 14px 4px; }
  .fp-outils { text-align:right; margin-bottom:8px; }
  .fp-outils button { padding:0; border:0; background:none; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; text-decoration:underline; }
  .fiche .corps dl { padding-top:10px; }
  .b { font-weight:700; }
  .fiche dt, .fp-corps dt, .fiche dd, .fp-corps dd { min-width:0; overflow-wrap:anywhere; }
  dt.b { color:var(--ink); } dd.i { font-style:italic; }
  .badge { display:inline-block; padding:1px 9px; border-radius:10px; background:#e8eef7; border:1px solid #c9d6ea; }
  .rg-corps li { flex-direction:column; align-items:stretch; border-bottom:1px solid #eef1f5; padding:6px 0; }
  .rg-l1, .rg-l2 { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .rg-l2 input[type=text] { flex:1; min-width:120px; }
  .rg-corps .nomcol small { color:var(--muted); }
  #reglages { position:absolute; inset:0; z-index:1200; background:#0006; display:none; align-items:center; justify-content:center; padding:12px; }
  #reglages.ouvert { display:flex; }
  .rg-boite { background:#fff; border-radius:12px; width:min(620px,100%); max-height:100%; display:flex; flex-direction:column; box-shadow:0 8px 30px #0005; }
  .rg-tete { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  .rg-tete h2 { margin:0; font-size:17px; }
  .rg-corps { overflow:auto; padding:6px 18px 18px; }
  .rg-corps section { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:12px; }
  .rg-corps h3 { margin:0 0 8px; font-size:14px; }
  .rg-corps ul { list-style:none; margin:0 0 8px; padding:0; }
  .rg-corps li { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:13px; }
  .rg-corps .nomcol { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .rg-corps button, .rg-tete button { font:inherit; font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .rg-corps select, .rg-corps input[type=text] { font:inherit; font-size:13px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; max-width:100%; }
  .rg-sec { display:flex; gap:6px; margin-bottom:8px; } .rg-sec input { flex:1; font-weight:600; }
  .rg-ajout { margin-top:12px; background:var(--accent) !important; color:#fff; border-color:var(--accent) !important; padding:7px 12px !important; font-size:13px !important; }
  .fp-corps .vide { color:var(--muted); }
  .fp-pied { padding:12px 18px; border-top:1px solid var(--line); }
  .fp-pied button { padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:6px; }
  @media (prefers-reduced-motion:reduce) { #fiche-panel { transition:none; } }
  @media (prefers-reduced-motion:reduce) { .fiche summary::after { transition:none; } }
  .pin.sombre { color:#1d2733; } .pin.f-rond { border-radius:50%; } .pin.f-carre { border-radius:7px; }
  .pin.f-losange { border-radius:7px; transform:rotate(45deg); } .pin.f-losange span { transform:rotate(-45deg); }
  .pin.f-triangle { border-radius:0; border:0; clip-path:polygon(50% 4%,98% 92%,2% 92%); padding-top:7px; box-shadow:none; }
  .legend .sep { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
  #filtres label { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
  #filtres select { display:block; width:210px; margin-top:2px; padding:5px; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:6px; }
  .rg-corps label { display:block; margin:8px 0; font-size:13px; } .rg-corps label select, .rg-corps label input[type=number] { margin-left:6px; }
  .rg-corps .rg-sec { margin-bottom:6px; } .rg-corps .rg-sec input { width:100%; }
  .leaflet-top.leaflet-left .panel { max-height:72vh; overflow:auto; }
  .leaflet-tooltip.nom-etab { display:none; font:600 12px system-ui,sans-serif; border:1px solid #0004; padding:2px 6px; }
  .noms-on .leaflet-tooltip.nom-etab { display:block; }
  #compteurs { margin-top:6px; line-height:1.5; } #compteurs strong { font-size:16px; color:var(--accent); }
  #filtres details { margin-top:6px; border:1px solid var(--line); border-radius:6px; }
  #filtres summary { padding:5px 8px; cursor:pointer; font-size:13px; }
  #filtres details label { display:block; margin:0; padding:2px 10px; color:var(--ink); font-size:13px; }
  #filtres .liste { max-height:160px; overflow:auto; padding-bottom:4px; }
  .rg-corps label input[type=text] { width:100%; margin:4px 0 0; box-sizing:border-box; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg"></div>
<aside id="fiche-panel" aria-label="Fiche de l’établissement" aria-hidden="true"></aside>

<script>
/* ================= RÉGLAGES PAR DÉFAUT ================= */
const VERSION = '13';
const TITRES_DEFAUT = ['Informations entreprise', 'Informations contrôles', 'Suites données', 'Section 4', 'Section 5', 'Section 6'];
const NIVEAUX = {
  faible:{cle:'faible',label:'Faible',couleur:'#2a9d8f',lettre:'F'}, moyen:{cle:'moyen',label:'Moyen',couleur:'#e9c46a',lettre:'M'},
  eleve:{cle:'eleve',label:'Élevé',couleur:'#f4821f',lettre:'É'}, critique:{cle:'critique',label:'Critique',couleur:'#c1121f',lettre:'C'},
  neutre:{cle:'neutre',label:'Non renseigné',couleur:'#6b7785',lettre:'?'},
};
const MOTS = [['critique',/critique|tres (eleve|fort|haut)|majeur|prioritaire/],['eleve',/eleve|fort|haut|important/],['moyen',/moyen|modere|intermediaire/],['faible',/faible|bas|mineur|limite/]];
const PALETTE = ['#1f77b4','#d62728','#2ca02c','#ff7f0e','#9467bd','#8c564b','#e377c2','#17becf','#bcbd22','#7f7f7f'];
const FORMES = ['rond','carre','losange','triangle'], SYMBOLES = { rond:'●', carre:'■', losange:'◆', triangle:'▲' };
const STYLES = { 'Normal':'', 'Gras':'b', 'Italique':'i', 'Pastille':'badge' };

const geopf = (l, f) => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${f}&LAYER=${l}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const fonds = {
  'Plan IGN': L.tileLayer(geopf('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'), { maxZoom:19, attribution:'© IGN – Géoplateforme' }),
  'Photographies aériennes': L.tileLayer(geopf('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'), { maxZoom:19, attribution:'© IGN – Géoplateforme' }),
};

/* ================= OUTILS ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sansAccent = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const joli = k => String(k).replace(/_/g,' ').replace(/^./, c => c.toUpperCase());
function niveauDe(v) { if (v == null || v === '') return null; const t = sansAccent(v); for (const [c, re] of MOTS) if (re.test(t)) return NIVEAUX[c]; return null; }
function formater(k, v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) { if (isNaN(v)) return null; const m = !v.getUTCHours() && !v.getUTCMinutes() && !v.getUTCSeconds(); return m ? v.toLocaleDateString('fr-FR',{timeZone:'UTC'}) : v.toLocaleString('fr-FR'); }
  if (typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if (Array.isArray(v)) return v.filter(x => x !== 'L').join(', ') || null;
  if (typeof v === 'object') return null;
  if (typeof v === 'number' && /date|le$|echeance|jour/i.test(k) && v > 1e9 && v < 5e9) return new Date(v*1000).toLocaleDateString('fr-FR');
  return String(v);
}
const afficherMsg = h => { const m = document.getElementById('msg'); m.innerHTML = h; m.style.display = h ? 'flex' : 'none'; };

/* ================= ÉTAT ================= */
let sigFiltres = '', opts = {}, lastRec = null, lastMap = null, cfg = { popup:[], sections:[] }, legCats = [], legFormes = [], legTitre = '';
let recherche = '', premierChargement = true, idSelectionne = null, ficheId = null, sansGps = 0, regroupPrec = true;
const marqueurs = new Map(), masques = new Set(), filtreSel = {}, etatSections = new Map();
const opt = (n, d) => (opts[n] === undefined || opts[n] === null || opts[n] === '') ? d : opts[n];

/* ================= CARTE ================= */
const map = L.map('map', { center:[46.6,2.5], zoom:6, layers:[fonds['Plan IGN']] });
L.control.layers(fonds, null, { position:'topright' }).addTo(map);
L.control.scale({ metric:true, imperial:false }).addTo(map);
const cluster = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius: () => opt('regrouper', true) === false ? 0 : 45 });
map.addLayer(cluster);

const haut = L.control({ position:'topleft' });
haut.onAdd = () => {
  const d = L.DomUtil.create('div','panel');
  d.innerHTML = '<input type="search" id="q" placeholder="Rechercher un nom…" aria-label="Rechercher un établissement"><div class="count" id="count"></div><div id="compteurs"></div><div id="filtres"></div><button class="link" id="noms" type="button" aria-pressed="false">Afficher les noms</button><br><button class="link" id="tout" type="button">Voir tous les points</button>';
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  d.querySelector('#q').addEventListener('input', e => { recherche = sansAccent(e.target.value.trim()); appliquerFiltres(); });
  d.querySelector('#tout').addEventListener('click', recentrer);
  d.querySelector('#filtres').addEventListener('change', e => {
    const c = e.target.dataset.c; if (!c) return;
    const det = e.target.closest('details');
    filtreSel[c] = [...det.querySelectorAll('input:checked')].map(x => x.value);
    det.querySelector('summary').textContent = joli(c) + (filtreSel[c].length ? ` (${filtreSel[c].length})` : '');
    appliquerFiltres();
  });
  d.querySelector('#noms').addEventListener('click', e => {
    const on = document.getElementById('map').classList.toggle('noms-on');
    e.target.setAttribute('aria-pressed', String(on)); e.target.textContent = on ? 'Masquer les noms' : 'Afficher les noms';
  });
  return d;
};
haut.addTo(map);

const legende = L.control({ position:'bottomleft' });
legende.onAdd = () => {
  const d = L.DomUtil.create('div','panel legend'); L.DomEvent.disableClickPropagation(d);
  d.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const on = b.getAttribute('aria-pressed') === 'true'; b.setAttribute('aria-pressed', String(!on));
    on ? masques.add(b.dataset.k) : masques.delete(b.dataset.k); appliquerFiltres();
  });
  return d;
};
legende.addTo(map);
function majLegende() {
  const d = legende.getContainer(); if (!d) return;
  d.innerHTML = `<strong>${esc(legTitre || 'Niveau de risque')}</strong>` + legCats.map(c =>
    `<button type="button" data-k="${esc(c.k)}" aria-pressed="${!masques.has(c.k)}"><i style="background:${c.couleur};border-radius:50%"></i>${esc(c.label)}</button>`).join('') +
    (legFormes.length ? '<div class="sep">' + legFormes.map(f => `<div>${SYMBOLES[f.forme]} ${esc(f.label)}</div>`).join('') + '</div>' : '');
}
function recentrer() { const p = [...marqueurs.values()].filter(m => cluster.hasLayer(m)).map(m => m.getLatLng()); if (p.length) map.fitBounds(p, { padding:[40,40], maxZoom:15 }); }
let cptDef = [];
function appliquerFiltres() {
  let n = 0; const cpt = cptDef.map(x => ({ ...x, n: 0 }));
  for (const m of marqueurs.values()) {
    const { niv, nom, fv } = m._cifi;
    const ok = !masques.has(niv.k) && (!recherche || sansAccent(nom).includes(recherche)) && Object.entries(filtreSel).every(([c, v]) => !v || !v.length || v.includes(fv[c]));
    if (ok) { n++; cpt.forEach(x => { if (m._cifi[x.k]) x.n++; }); if (!cluster.hasLayer(m)) cluster.addLayer(m); } else if (cluster.hasLayer(m)) cluster.removeLayer(m);
  }
  document.getElementById('compteurs').innerHTML = cpt.map(x => `<div><strong>${x.n}</strong> ${esc(x.titre)}</div>`).join('');
  document.getElementById('count').innerHTML = `<strong>${n}</strong> sur ${marqueurs.size} établissement${marqueurs.size > 1 ? 's' : ''}` + (sansGps ? `<br>${sansGps} sans coordonnées valides` : '') + `<br><small>version ${VERSION}</small>`;
}
function icone(d, sel) {
  const t = +opt('taille', 30) || 30, cl = d.forme ? `f-${d.forme}${d.niv.cle === 'moyen' ? ' sombre' : ''}` : d.niv.cle;
  return L.divIcon({ className:'', iconSize:[t,t], iconAnchor:[t/2,t/2], popupAnchor:[0,-t/2],
    html:`<div class="pin ${cl}${sel ? ' sel' : ''}" style="background:${d.niv.couleur};width:${t}px;height:${t}px"><span>${esc(d.niv.lettre)}</span></div>` });
}

/* ================= FICHES ================= */
const lignes = l => `<dl>${l.map(([k, v, x]) => `<dt${x && x.gn ? ' class="b"' : ''}>${esc(k)}</dt><dd${x && x.vs === 'i' ? ' class="i"' : x && x.vs === 'b' ? ' class="b"' : ''}>${x && x.vs === 'badge' ? `<span class="badge">${esc(v)}</span>` : esc(v)}</dd>`).join('')}</dl>`;
const champsDe = (liste, raw) => liste.map(x => [joli(x.c), formater(x.c, raw[x.c]), x]).filter(a => a[1] !== null);
const aide = t => `<p style="padding:10px 14px;margin:0;color:var(--muted);font-size:13px">${t}</p>`;

function fichier(d) {
  return `<div class="fiche" style="--niv:${d.niv.couleur}"><header><h3>${esc(d.nom || 'Sans nom')}</h3>
    <span class="niv" style="background:${d.niv.couleur};color:${d.niv.cle === 'moyen' ? '#1d2733' : '#fff'}">${esc(d.niv.texte || d.niv.label)}</span></header>
    <div class="corps">${cfg.popup.length ? lignes(champsDe(cfg.popup, d.raw)) : aide('Choisissez les colonnes du popup dans le panneau de droite de Grist (« Colonnes du popup »).')}</div>
    <div class="pied"><button type="button" class="btn-fiche" data-id="${Number(d.id)}">Voir la fiche complète</button></div></div>`;
}
function corpsFiche(d) {
  const secs = cfg.sections.map(sec => ({ sec, l: champsDe(sec.cols, d.raw) })).filter(x => x.l.length);
  if (!secs.length) return '<p class="vide">Aucune section à afficher. Dans le panneau de droite de Grist, remplissez « Fiche – section 1 (colonnes) » et les suivantes.</p>';
  const o = opt('ouverture', 'Première section'), ouvert = (k, i) => etatSections.has(k) ? etatSections.get(k) : (o === 'Toutes' || (o !== 'Aucune' && i === 0));
  return (secs.length > 1 ? '<div class="fp-outils"><button type="button" class="fp-tout">Tout déplier / replier</button></div>' : '') +
    secs.map((x, k) => `<details class="theme" data-t="${x.sec.cle}"${ouvert(x.sec.cle, k) ? ' open' : ''}><summary>${esc(x.sec.nom)} <span class="nb">(${x.l.length})</span></summary>${lignes(x.l)}</details>`).join('');
}
const panneau = document.getElementById('fiche-panel');
function ouvrirFiche(id, focus = true) {
  const m = marqueurs.get(id); if (!m) return; const d = m._cifi; ficheId = id;
  panneau.style.setProperty('--niv', d.niv.couleur);
  panneau.innerHTML = `<div class="fp-tete"><button type="button" class="fp-fermer" aria-label="Fermer la fiche">✕</button><h2>${esc(d.nom || 'Sans nom')}</h2>
    <span class="niv" style="background:${d.niv.couleur};color:${d.niv.cle === 'moyen' ? '#1d2733' : '#fff'}">${esc(d.niv.texte || d.niv.label)}</span></div>
    <div class="fp-corps">${corpsFiche(d)}</div><div class="fp-pied"><button type="button" class="fp-select">Sélectionner la ligne dans Grist</button></div>`;
  panneau.classList.add('ouvert'); panneau.setAttribute('aria-hidden', 'false');
  if (focus) panneau.querySelector('.fp-fermer').focus();
}
function fermerFiche() { ficheId = null; panneau.classList.remove('ouvert'); panneau.setAttribute('aria-hidden', 'true'); }
panneau.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.theme')) etatSections.set(e.target.dataset.t, e.target.open); }, true);
panneau.addEventListener('click', e => {
  if (e.target.closest('.fp-fermer')) fermerFiche();
  if (e.target.closest('.fp-tout')) { const t = [...panneau.querySelectorAll('details.theme')], o = t.some(x => !x.open); t.forEach(x => { x.open = o; }); }
  const sel = e.target.closest('.fp-select');
  if (sel && ficheId !== null) { grist.setSelectedRows([ficheId]); if (grist.setCursorPos) grist.setCursorPos({ rowId:ficheId }); sel.textContent = '✓ Ligne sélectionnée dans Grist'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ficheId !== null) fermerFiche(); });
map.on('popupopen', e => {
  const el = e.popup.getElement(), b = el && el.querySelector('.btn-fiche'); if (!b) return;
  L.DomEvent.disableClickPropagation(b);
  b.addEventListener('click', () => { ouvrirFiche(Number(b.dataset.id)); map.closePopup(); });
});

/* ================= GRIST ================= */
grist.ready({
  requiredAccess: 'read table', allowSelectBy: true,
  columns: [
    { name:'nom',    title:'Nom de l’établissement', type:'Text' },
    { name:'lat',    title:'Latitude', type:'Numeric' },
    { name:'lng',    title:'Longitude', type:'Numeric' },
    { name:'niveau', title:'Couleur des points : colonne (ex. niveau de risque)', type:'Any', optional:true },
    { name:'forme',  title:'Forme des points : colonne (facultatif)', type:'Any', optional:true },
    { name:'filtres',title:'Filtres : colonnes à proposer (choix multiples)', type:'Any', optional:true, allowMultiple:true },
    { name:'ctrl',   title:'Compteur « à contrôler » : colonne', type:'Any', optional:true },
    { name:'actif',  title:'Compteur « actifs » : colonne', type:'Any', optional:true },
    { name:'popup',  title:'Colonnes du popup', type:'Any', optional:true, allowMultiple:true },
    ...[1,2,3,4,5,6].map(n => ({ name:'t' + n, title:'Fiche – section ' + n + ' (colonnes)', type:'Any', optional:true, allowMultiple:true })),
    { name:'gras',   title:'Colonnes dont le nom est en gras', type:'Any', optional:true, allowMultiple:true },
  ],
  options: [
    ...[1,2,3,4,5,6].map(n => ({ name:'titre' + n, title:'Titre de la section ' + n, type:'string', defaultValue:TITRES_DEFAUT[n - 1] })),
    { name:'ctrl_titre', title:'Compteur 1 : titre', type:'string', defaultValue:'À contrôler' },
    { name:'ctrl_valeur', title:'Compteur 1 : valeur comptée', type:'string', defaultValue:'À contrôler' },
    { name:'actif_titre', title:'Compteur 2 : titre', type:'string', defaultValue:'Actifs' },
    { name:'actif_valeur', title:'Compteur 2 : valeur comptée', type:'string', defaultValue:'Actif' },
    { name:'noms_gras', title:'Tous les noms de colonnes en gras', type:'boolean', defaultValue:false },
    { name:'style_valeurs', title:'Forme des valeurs', type:'choice', choices:Object.keys(STYLES), defaultValue:'Normal' },
    { name:'ouverture', title:'Sections dépliées à l’ouverture', type:'choice', choices:['Première section','Toutes','Aucune'], defaultValue:'Première section' },
    { name:'regrouper', title:'Regrouper les points proches', type:'boolean', defaultValue:true },
    { name:'taille', title:'Taille des points (px)', type:'number', defaultValue:30 },
  ],
});
grist.onOptions(o => { opts = o || {}; if (lastRec) construire(); });

/* ---- Fenêtre « Configurer le widget », ouverte par le bouton du panneau de droite de Grist ---- */
const modal = document.createElement('div'); modal.id = 'reglages'; document.body.appendChild(modal);
const sel = (n, choix) => `<select data-o="${n}">${choix.map(c => `<option${opt(n, choix[0]) === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
function ouvrirReglages() {
  modal.innerHTML = `<div class="rg-boite" role="dialog" aria-label="Configurer le widget"><div class="rg-tete"><h2>Configurer le widget</h2><button type="button" data-a="fermer">Fermer</button></div>
    <div class="rg-corps"><section><h3>Titres des sections de la fiche</h3>
      ${[1,2,3,4,5,6].map(n => `<div class="rg-sec"><input type="text" data-o="titre${n}" value="${esc(opt('titre' + n, TITRES_DEFAUT[n - 1]))}" aria-label="Titre de la section ${n}"></div>`).join('')}
      <p class="vide" style="font-size:12px;margin:4px 0 0">Une section n’apparaît dans la fiche que si des colonnes lui sont associées dans le panneau de droite (« Fiche – section N »).</p></section>
    <section><h3>Compteurs (panneau de gauche)</h3>
      <label>Compteur 1 – titre <input type="text" data-o="ctrl_titre" value="${esc(opt('ctrl_titre', 'À contrôler'))}"></label>
      <label>Compteur 1 – valeur comptée <input type="text" data-o="ctrl_valeur" value="${esc(opt('ctrl_valeur', 'À contrôler'))}"></label>
      <label>Compteur 2 – titre <input type="text" data-o="actif_titre" value="${esc(opt('actif_titre', 'Actifs'))}"></label>
      <label>Compteur 2 – valeur comptée <input type="text" data-o="actif_valeur" value="${esc(opt('actif_valeur', 'Actif'))}"></label></section>
    <section><h3>Affichage</h3>
      <label><input type="checkbox" data-o="noms_gras"${opt('noms_gras', false) === true ? ' checked' : ''}> Tous les noms de colonnes en gras</label>
      <label>Forme des valeurs ${sel('style_valeurs', Object.keys(STYLES))}</label>
      <label>Sections dépliées à l’ouverture ${sel('ouverture', ['Première section', 'Toutes', 'Aucune'])}</label>
      <label><input type="checkbox" data-o="regrouper"${opt('regrouper', true) !== false ? ' checked' : ''}> Regrouper les points proches</label>
      <label>Taille des points <input type="number" min="16" max="48" data-o="taille" value="${+opt('taille', 30)}"> px</label></section></div></div>`;
  modal.classList.add('ouvert');
}
function boutonSecours() {   // uniquement si cette version de Grist ne propose pas le bouton dans son panneau de droite
  const b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = '⚙ Configurer le widget'; b.addEventListener('click', ouvrirReglages);
  const t = document.getElementById('tout'); if (t) t.insertAdjacentElement('afterend', b);
}
try { if (typeof grist.onEditOptions === 'function') grist.onEditOptions(ouvrirReglages); else boutonSecours(); } catch (e) { boutonSecours(); }
modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-a="fermer"]')) modal.classList.remove('ouvert'); });
modal.addEventListener('change', e => {
  const t = e.target, n = t.dataset.o; if (!n) return;
  const v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.min(48, Math.max(16, +t.value || 30)) : t.value;
  opts[n] = v; if (lastRec) construire();
  Promise.resolve(grist.setOption(n, v)).catch(() => alert('Vous n’avez pas le droit de modifier la configuration de ce widget.'));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('ouvert'); });

grist.onRecords((records, mappings) => { lastRec = records; lastMap = mappings; construire(); });

function construire() {
  const m = lastMap, mapped = grist.mapColumnNames(lastRec);
  if (!mapped || !m) { afficherMsg('<div><strong>Associez les colonnes</strong><br>Dans le panneau de droite, indiquez le nom, la latitude et la longitude.</div>'); return; }
  afficherMsg('');
  const liste = k => [].concat(m[k] || []).filter(Boolean);
  const gras = new Set(liste('gras')), vs = STYLES[opt('style_valeurs', 'Normal')] ?? '';
  const mk = c => ({ c, gn: gras.has(c) || opt('noms_gras', false) === true, vs });
  cfg = { popup: liste('popup').map(mk), sections: [1,2,3,4,5,6].map(n => ({ cle:'s' + n, nom: String(opt('titre' + n, '')).trim() || TITRES_DEFAUT[n - 1], cols: liste('t' + n).map(mk) })).filter(x => x.cols.length) };
  const cC = m.niveau, cF = m.forme, cFil = liste('filtres'), cCtrl = m.ctrl, cAct = m.actif;
  const egal = (v, t) => { const f = formater('', v); return f !== null && sansAccent(f).trim() === sansAccent(String(t)).trim(); };
  cptDef = [cCtrl && { k:'ctrl', titre:String(opt('ctrl_titre', 'À contrôler')) }, cAct && { k:'actif', titre:String(opt('actif_titre', 'Actifs')) }].filter(Boolean);

  // catégories pour couleur et forme
  const brut = c => v => (v == null || v === '') ? '' : String(formater(c, v) ?? v);
  const vC = new Set(), vF = new Set();
  lastRec.forEach(r => { if (cC) vC.add(brut(cC)(r[cC])); if (cF) vF.add(brut(cF)(r[cF])); });
  const autres = [...vC].filter(v => v && !niveauDe(v)).sort(), valsF = [...vF].filter(Boolean).sort();
  const nivDe = v => {
    if (!cC) return { ...NIVEAUX.neutre, k:'neutre', texte:'' };
    const t = brut(cC)(v), n = niveauDe(t);
    if (n) return { ...n, k:n.cle, texte:t };
    if (!t) return { ...NIVEAUX.neutre, k:'neutre', texte:'' };
    return { cle:'cat', k:'c:' + t, label:t, texte:t, couleur:PALETTE[autres.indexOf(t) % PALETTE.length], lettre:t.charAt(0).toUpperCase() };
  };
  const formeDe = v => { const t = brut(cF)(v); return cF && t ? FORMES[valsF.indexOf(t) % FORMES.length] : null; };

  const vus = new Set(), cats = new Map(); sansGps = 0;
  lastRec.forEach((raw, i) => {
    const r = mapped[i], lat = Number(r.lat), lng = Number(r.lng);
    if (r.lat == null || r.lng == null || r.lat === '' || r.lng === '' || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) { sansGps++; return; }
    const niv = nivDe(cC ? raw[cC] : null), fv = {};
    cFil.forEach(c => { fv[c] = formater(c, raw[c]) ?? '(vide)'; });
    const d = { id:raw.id, nom:r.nom, niv, forme: cF ? formeDe(raw[cF]) : null, raw, fv, ctrl: !!cCtrl && egal(raw[cCtrl], opt('ctrl_valeur', 'À contrôler')), actif: !!cAct && egal(raw[cAct], opt('actif_valeur', 'Actif')) };
    vus.add(raw.id); cats.set(niv.k, niv);
    let mk2 = marqueurs.get(raw.id);
    if (mk2) mk2.setLatLng([lat, lng]);
    else {
      mk2 = L.marker([lat, lng], { title:r.nom || '', keyboard:true });
      mk2.bindPopup(() => fichier(mk2._cifi), { maxWidth:320, className:'cifi-popup' });
      mk2.on('click', () => grist.setSelectedRows([raw.id]));
      mk2.bindTooltip(String(r.nom || ''), { permanent:true, direction:'right', offset:[14,0], className:'nom-etab' });
      marqueurs.set(raw.id, mk2);
    }
    if (mk2.setTooltipContent) mk2.setTooltipContent(String(r.nom || ''));
    mk2._cifi = d; mk2.setIcon(icone(d, raw.id === idSelectionne));
    if (mk2.isPopupOpen()) mk2.getPopup().update();
  });
  for (const [id, x] of [...marqueurs]) if (!vus.has(id)) { cluster.removeLayer(x); marqueurs.delete(id); }

  // légende et filtres
  legTitre = cC ? joli(cC) : '';
  legCats = [...cats.values()].sort((a, b) => a.label.localeCompare(b.label)).map(c => ({ k:c.k, label:c.cle === 'cat' ? c.label : c.label, couleur:c.couleur }));
  legFormes = cF ? valsF.map(v => ({ forme:FORMES[valsF.indexOf(v) % FORMES.length], label:v })) : [];
  majLegende();
  const zone = document.getElementById('filtres');
  const valsDe = c => [...new Set([...marqueurs.values()].map(x => x._cifi.fv[c]))].filter(v => v !== undefined).sort((a, b) => String(a).localeCompare(String(b), 'fr')).slice(0, 200);
  const sig = JSON.stringify(cFil.map(c => [c, valsDe(c)]));
  Object.keys(filtreSel).forEach(c => { if (!cFil.includes(c)) delete filtreSel[c]; else filtreSel[c] = (filtreSel[c] || []).filter(v => valsDe(c).includes(v)); });
  if (sig !== sigFiltres) {
    sigFiltres = sig;
    zone.innerHTML = cFil.map(c => { const sl = new Set(filtreSel[c] || []);
      return `<details${sl.size ? ' open' : ''}><summary>${esc(joli(c))}${sl.size ? ` (${sl.size})` : ''}</summary><div class="liste">${valsDe(c).map(v => `<label><input type="checkbox" data-c="${esc(c)}" value="${esc(v)}"${sl.has(v) ? ' checked' : ''}> ${esc(v)}</label>`).join('')}</div></details>`; }).join('');
  }
  const reg = opt('regrouper', true) !== false; if (reg !== regroupPrec) { cluster.clearLayers(); regroupPrec = reg; }
  appliquerFiltres();
  if (ficheId !== null) { marqueurs.has(ficheId) ? ouvrirFiche(ficheId, false) : fermerFiche(); }
  if (premierChargement && marqueurs.size) { recentrer(); premierChargement = false; }
}

grist.onRecord(rec => {
  const a = marqueurs.get(idSelectionne); idSelectionne = rec ? rec.id : null;
  if (a) a.setIcon(icone(a._cifi, false));
  const m = marqueurs.get(idSelectionne); if (!m) return;
  const ouverte = m.isPopupOpen(); m.setIcon(icone(m._cifi, true));
  if (!ouverte && cluster.hasLayer(m)) cluster.zoomToShowLayer(m, () => { map.panTo(m.getLatLng()); m.openPopup(); });
});
</script>
