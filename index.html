<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIFI – Carte des contrôles</title>

<!--
  Les bibliothèques sont chargées depuis le dossier "lib" (aucun site tiers).
  Si le dossier lib est vide, exécutez telecharger-libs.ps1 (Windows) ou telecharger-libs.sh (Linux/Mac). Voir LISEZMOI.md.
  grist-plugin-api.js est fourni par Grist lui-même : changez l'adresse si votre instance est différente.
-->
<link rel="stylesheet" href="./lib/leaflet.css">
<link rel="stylesheet" href="./lib/MarkerCluster.css">
<link rel="stylesheet" href="./lib/MarkerCluster.Default.css">
<script src="./lib/leaflet.js"></script>
<script src="./lib/leaflet.markercluster.js"></script>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>

<style>
  :root { --ink:#1d2733; --muted:#5d6b7a; --paper:#fff; --line:#dde3ea; --accent:#1f4e8c; }
  html, body { height:100%; margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  #map { height:100%; width:100%; }
  #msg { position:absolute; inset:0; z-index:1000; display:none; align-items:center; justify-content:center;
         background:rgba(255,255,255,.95); padding:24px; text-align:center; line-height:1.5; font-size:15px; }

  /* Marqueurs : couleur + forme + lettre */
  .pin { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #0007;
         display:flex; align-items:center; justify-content:center; font:700 12px/1 system-ui,sans-serif; color:#fff; box-sizing:border-box; }
  .pin.moyen { color:#1d2733; border-radius:7px; }
  .pin.eleve { border-radius:7px; transform:rotate(45deg); }
  .pin.eleve span { transform:rotate(-45deg); }
  .pin.critique { box-shadow:0 0 0 4px #c1121f55, 0 0 0 1px #0007; }
  .pin.sel { outline:3px solid var(--accent); outline-offset:3px; }

  /* Panneaux */
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px #0002; padding:10px; font-size:13px; }
  .panel input[type=search] { width:210px; box-sizing:border-box; padding:7px 9px; font:inherit; border:1px solid var(--line); border-radius:6px; }
  .panel .count { margin-top:6px; color:var(--muted); line-height:1.4; }
  .panel button.link { margin-top:4px; padding:0; border:0; background:none; color:var(--accent); font:inherit; cursor:pointer; text-decoration:underline; }
  .legend button { display:flex; align-items:center; gap:8px; width:100%; padding:5px 6px; margin:1px 0; font:inherit; text-align:left;
                   background:none; border:1px solid transparent; border-radius:6px; cursor:pointer; color:var(--ink); }
  .legend button:hover { background:#f1f4f8; }
  .legend button[aria-pressed=false] { opacity:.45; text-decoration:line-through; }
  .legend strong { display:block; margin-bottom:4px; }
  .legend i { flex:none; width:13px; height:13px; border:1px solid #0006; }
  .b-faible { background:#2a9d8f; border-radius:50%; } .b-moyen { background:#e9c46a; border-radius:3px; }
  .b-eleve { background:#f4821f; transform:rotate(45deg) scale(.85); } .b-critique { background:#c1121f; border-radius:50%; box-shadow:0 0 0 2px #c1121f55; }
  .b-neutre { background:#6b7785; border-radius:50%; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid #f4821f; outline-offset:2px; }

  /* Popup pliable */
  .cifi-popup .leaflet-popup-content-wrapper { border-radius:12px; padding:0; overflow:hidden; }
  .cifi-popup .leaflet-popup-content { margin:0; width:300px !important; }
  .fiche header { padding:12px 14px 10px; border-left:6px solid var(--niv); background:#f6f8fb; }
  .fiche h3 { margin:0 0 6px; font-size:15px; line-height:1.3; }
  .fiche .niv { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; border:1px solid #0003; }
  .fiche .corps { max-height:260px; overflow:auto; }
  .fiche details { border-top:1px solid var(--line); }
  .fiche summary { padding:9px 14px; cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .fiche summary::-webkit-details-marker { display:none; }
  .fiche summary::after { content:"▾"; color:var(--muted); transition:transform .15s; }
  .fiche details[open] summary::after { transform:rotate(180deg); }
  .fiche dl { margin:0; padding:0 14px 10px; display:grid; grid-template-columns:minmax(80px,38%) minmax(0,1fr); gap:4px 10px; font-size:13px; }
  .fiche dt { color:var(--muted); } .fiche dd { margin:0; overflow-wrap:anywhere; }
  .fiche .pied { padding:10px 14px; border-top:1px solid var(--line); }
  .fiche .pied button { padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:var(--accent); color:#fff; border:0; border-radius:6px; }
  /* Volet « fiche complète » */
  #fiche-panel { position:absolute; top:0; right:0; bottom:0; width:min(400px,100%); z-index:1100; background:var(--paper);
    box-shadow:-4px 0 18px #0003; display:flex; flex-direction:column; transform:translateX(105%); visibility:hidden;
    transition:transform .2s ease, visibility .2s; }
  #fiche-panel.ouvert { transform:none; visibility:visible; }
  .fp-tete { position:relative; padding:16px 52px 14px 18px; border-left:8px solid var(--niv); background:#f6f8fb; border-bottom:1px solid var(--line); }
  .fp-tete h2 { margin:0 0 8px; font-size:18px; line-height:1.3; }
  .fp-tete .niv { display:inline-block; padding:3px 12px; border-radius:12px; font-size:13px; font-weight:600; border:1px solid #0003; }
  .fp-fermer { position:absolute; top:10px; right:10px; width:34px; height:34px; border:1px solid var(--line); border-radius:50%;
    background:#fff; font-size:16px; cursor:pointer; color:var(--ink); }
  .fp-fermer:hover { background:#eef2f7; }
  .fp-corps { flex:1; overflow:auto; padding:14px 18px; }
  .fp-corps dl { margin:0; display:grid; grid-template-columns:minmax(100px,38%) minmax(0,1fr); gap:10px 12px; font-size:14px; }
  .fp-corps dt { color:var(--muted); } .fp-corps dd { margin:0; overflow-wrap:anywhere; }
  .fp-corps details.theme { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .fp-corps summary { padding:10px 14px; cursor:pointer; font-weight:600; font-size:14px; list-style:none; display:flex; align-items:center; gap:8px; background:#f6f8fb; }
  .fp-corps summary::-webkit-details-marker { display:none; }
  .fp-corps summary::after { content:"▾"; margin-left:auto; color:var(--muted); transition:transform .15s; }
  .fp-corps details[open] > summary::after { transform:rotate(180deg); }
  .fp-corps summary .nb { font-weight:400; font-size:12px; color:var(--muted); }
  .fp-corps details.theme dl { padding:12px 14px 4px; }
  .fp-outils { text-align:right; margin-bottom:8px; }
  .fp-outils button { padding:0; border:0; background:none; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; text-decoration:underline; }
  .fiche .corps dl { padding-top:10px; }
  .b { font-weight:700; }
  .fiche dt, .fp-corps dt, .fiche dd, .fp-corps dd { min-width:0; overflow-wrap:anywhere; }
  dt.b { color:var(--ink); } dd.i { font-style:italic; }
  .badge { display:inline-block; padding:1px 9px; border-radius:10px; background:#e8eef7; border:1px solid #c9d6ea; }
  .rg-corps li { flex-direction:column; align-items:stretch; border-bottom:1px solid #eef1f5; padding:6px 0; }
  .rg-l1, .rg-l2 { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .rg-l2 input[type=text] { flex:1; min-width:120px; }
  .rg-corps .nomcol small { color:var(--muted); }
  #reglages { position:absolute; inset:0; z-index:1200; background:#0006; display:none; align-items:center; justify-content:center; padding:12px; }
  #reglages.ouvert { display:flex; }
  .rg-boite { background:#fff; border-radius:12px; width:min(620px,100%); max-height:100%; display:flex; flex-direction:column; box-shadow:0 8px 30px #0005; }
  .rg-tete { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  .rg-tete h2 { margin:0; font-size:17px; }
  .rg-corps { overflow:auto; padding:6px 18px 18px; }
  .rg-corps section { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:12px; }
  .rg-corps h3 { margin:0 0 8px; font-size:14px; }
  .rg-corps ul { list-style:none; margin:0 0 8px; padding:0; }
  .rg-corps li { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:13px; }
  .rg-corps .nomcol { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .rg-corps button, .rg-tete button { font:inherit; font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .rg-corps select, .rg-corps input[type=text] { font:inherit; font-size:13px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; max-width:100%; }
  .rg-sec { display:flex; gap:6px; margin-bottom:8px; } .rg-sec input { flex:1; font-weight:600; }
  .rg-ajout { margin-top:12px; background:var(--accent) !important; color:#fff; border-color:var(--accent) !important; padding:7px 12px !important; font-size:13px !important; }
  .fp-corps .vide { color:var(--muted); }
  .fp-pied { padding:12px 18px; border-top:1px solid var(--line); }
  .fp-pied button { padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:6px; }
  @media (prefers-reduced-motion:reduce) { #fiche-panel { transition:none; } }
  @media (prefers-reduced-motion:reduce) { .fiche summary::after { transition:none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg"></div>
<aside id="fiche-panel" aria-label="Fiche de l’établissement" aria-hidden="true"></aside>

<script>
/* ================= RÉGLAGES (modifiables) ================= */
// Colonnes de votre table à NE PAS montrer dans la fiche (écrivez leur identifiant Grist exact).
const COLONNES_MASQUEES = [];
// THÉMATIQUES de la fiche complète : ce qui précède « __ » (deux tirets bas) dans l'identifiant d'une colonne donne le titre de la section.
// Exemple : la colonne Controle__Date_dernier est rangée dans la section « Controle », avec l'intitulé « Date dernier ».
// Pour mettre des accents ou un titre précis, complétez ici : { Identite: 'Identité', Suites: 'Suites données' }
const TITRES_SECTIONS = {};
// Titres par défaut des 6 sections de la fiche (modifiables aussi dans le panneau de droite de Grist, si votre Grist le propose).
const TITRES_DEFAUT = ['Informations entreprise', 'Informations contrôles', 'Suites données', 'Section 4', 'Section 5', 'Section 6'];
const SECTION_SANS_THEME = 'Autres informations';   // pour les colonnes sans « __ »
// À l'ouverture de la fiche : 'premiere' (seule la 1re section est dépliée), 'toutes' ou 'aucune'
const OUVERTURE = 'premiere';
const VERSION = '10';
// Les réglages ne sont proposés qu'aux personnes pouvant modifier le document (Grist signale les lecteurs par ?readonly=...).
const peutModifier = !/[?&]readonly=(1|true)/i.test(location.search);   // affichée en haut à gauche pour vérifier que la dernière version est bien chargée

// Niveaux de risque : le widget lit le texte de votre colonne (accents et majuscules sans importance).
const NIVEAUX = {
  faible:   { cle:'faible',   label:'Faible',   couleur:'#2a9d8f', lettre:'F' },
  moyen:    { cle:'moyen',    label:'Moyen',    couleur:'#e9c46a', lettre:'M' },
  eleve:    { cle:'eleve',    label:'Élevé',    couleur:'#f4821f', lettre:'É' },
  critique: { cle:'critique', label:'Critique', couleur:'#c1121f', lettre:'C' },
  neutre:   { cle:'neutre',   label:'Non renseigné', couleur:'#6b7785', lettre:'?' },
};
const MOTS = [ // mots reconnus (minuscules, sans accent)
  ['critique', /critique|tres (eleve|fort|haut)|majeur|prioritaire/],
  ['eleve',    /eleve|fort|haut|important/],
  ['moyen',    /moyen|modere|intermediaire/],
  ['faible',   /faible|bas|mineur|limite/],
];

// Fonds de carte : Géoplateforme IGN. Pour une étanchéité totale, remplacez par vos propres tuiles.
const geopf = (layer, fmt) => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${fmt}&LAYER=${layer}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const fonds = {
  'Plan IGN': L.tileLayer(geopf('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'), { maxZoom:19, attribution:'© IGN – Géoplateforme' }),
  'Photographies aériennes': L.tileLayer(geopf('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'), { maxZoom:19, attribution:'© IGN – Géoplateforme' }),
};

/* ================= OUTILS ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sansAccent = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function niveau(v) {
  if (v == null || v === '') return { ...NIVEAUX.neutre, texte:'' };
  const t = sansAccent(v);
  for (const [cle, re] of MOTS) if (re.test(t)) return { ...NIVEAUX[cle], texte:String(v) };
  return { ...NIVEAUX.neutre, texte:String(v) };
}
const joli = k => k.replace(/_/g,' ').replace(/^./, c => c.toUpperCase());
function formater(k, v) {
  if (v == null || v === '') return null;
  if (typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if (Array.isArray(v)) return v.filter(x => x !== 'L').join(', ') || null;       // listes de choix
  if (v instanceof Date) {
    if (isNaN(v)) return null;
    const minuit = !v.getUTCHours() && !v.getUTCMinutes() && !v.getUTCSeconds();
    return minuit ? v.toLocaleDateString('fr-FR', { timeZone:'UTC' }) : v.toLocaleString('fr-FR');
  }
  if (typeof v === 'object') return null;                                          // données techniques : ignorées
  if (typeof v === 'number' && /date|le$|echeance|jour/i.test(k) && v > 1e9 && v < 5e9)
    return new Date(v * 1000).toLocaleDateString('fr-FR');                         // colonnes de type Date
  return String(v);
}
function decouper(col) { const i = col.indexOf('__'); return i > 0 ? { theme: col.slice(0, i), nom: col.slice(i + 2) } : { theme: null, nom: col }; }
let titresOpt = {};
function titreSection(sec) {
  if (/^t\d$/.test(sec.cle)) { const n = +sec.cle.slice(1); return (titresOpt['titre' + n] || '').trim() || TITRES_DEFAUT[n - 1]; }
  return titreTheme(sec.cle.slice(2) || null);
}
const titreTheme = t => t === null ? SECTION_SANS_THEME : (TITRES_SECTIONS[t] || joli(t));
function extraire(cols, raw) {
  return cols.map(c => { const { theme, nom } = decouper(c); return { theme, label: joli(nom), val: formater(c, raw[c]) }; }).filter(x => x.val !== null);
}
function grouper(liste) {   // regroupe par thématique, dans l'ordre où les colonnes ont été choisies
  const g = new Map();
  for (const x of liste) { if (!g.has(x.theme)) g.set(x.theme, []); g.get(x.theme).push([x.label, x.val]); }
  return [...g].map(([t, l]) => ({ cle: 'p:' + (t ?? ''), lignes: l }));
}
const afficherMsg = h => { const m = document.getElementById('msg'); m.innerHTML = h; m.style.display = h ? 'flex' : 'none'; };

/* ================= CARTE ================= */
const map = L.map('map', { center:[46.6,2.5], zoom:6, layers:[fonds['Plan IGN']] });
L.control.layers(fonds, null, { position:'topright' }).addTo(map);
L.control.scale({ metric:true, imperial:false }).addTo(map);
const cluster = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius:45 });
map.addLayer(cluster);

const marqueurs = new Map();      // id Grist → marqueur
const masques = new Set();        // niveaux masqués via la légende
let recherche = '', premierChargement = true, idSelectionne = null;

// Panneau recherche + compteur
const haut = L.control({ position:'topleft' });
haut.onAdd = () => {
  const d = L.DomUtil.create('div','panel');
  d.innerHTML = '<input type="search" id="q" placeholder="Rechercher un nom…" aria-label="Rechercher un établissement">' +
                '<div class="count" id="count"></div><button class="link" id="reg" type="button">⚙ Réglages de la fiche</button><br><button class="link" id="tout" type="button">Voir tous les points</button>';
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  d.querySelector('#q').addEventListener('input', e => { recherche = sansAccent(e.target.value.trim()); appliquerFiltres(); });
  d.querySelector('#tout').addEventListener('click', recentrer);
  if (peutModifier) d.querySelector('#reg').addEventListener('click', ouvrirReglages); else d.querySelector('#reg').remove();
  return d;
};
haut.addTo(map);

// Légende cliquable = filtre par niveau
const legende = L.control({ position:'bottomleft' });
legende.onAdd = () => {
  const d = L.DomUtil.create('div','panel legend');
  d.innerHTML = '<strong>Niveau de risque</strong>' + Object.values(NIVEAUX).map(n =>
    `<button type="button" data-n="${n.cle}" aria-pressed="true"><i class="b-${n.cle}"></i>${n.label}</button>`).join('');
  L.DomEvent.disableClickPropagation(d);
  d.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    on ? masques.add(b.dataset.n) : masques.delete(b.dataset.n);
    appliquerFiltres();
  });
  return d;
};
legende.addTo(map);

function recentrer() {
  const pts = [...marqueurs.values()].filter(m => cluster.hasLayer(m)).map(m => m.getLatLng());
  if (pts.length) map.fitBounds(pts, { padding:[40,40], maxZoom:15 });
}
function appliquerFiltres() {
  let n = 0;
  for (const m of marqueurs.values()) {
    const { niv, nom } = m._cifi;
    const visible = !masques.has(niv.cle) && (!recherche || sansAccent(nom).includes(recherche));
    if (visible) { n++; if (!cluster.hasLayer(m)) cluster.addLayer(m); }
    else if (cluster.hasLayer(m)) cluster.removeLayer(m);
  }
  document.getElementById('count').innerHTML = `<strong>${n}</strong> sur ${marqueurs.size} établissement${marqueurs.size>1?'s':''}` +
    (sansGps ? `<br>${sansGps} sans coordonnées valides` : '') + `<br><small>version ${VERSION}</small>`;
}

const panneau = document.getElementById('fiche-panel');
let ficheId = null;
const lignes = l => `<dl>${l.map(([k, v, x]) => `<dt${x && x.gn ? ' class="b"' : ''}>${esc(k)}</dt><dd${x && x.vs === 'i' ? ' class="i"' : x && x.vs === 'b' ? ' class="b"' : ''}>${x && x.vs === 'badge' ? `<span class="badge">${esc(v)}</span>` : esc(v)}</dd>`).join('')}</dl>`;

let cfg = { popup: [], sections: [] }, labels = {}, allCols = [];
const libel = c => labels[c] || joli(c);
function fmt(c, v) {   // formatage selon le type réel de la colonne dans Grist
  const t = types[c] || '';
  if (typeof v === 'number' && t === 'Date') return new Date(v * 1000).toLocaleDateString('fr-FR', { timeZone:'UTC' });
  if (typeof v === 'number' && t.startsWith('DateTime')) return new Date(v * 1000).toLocaleString('fr-FR');
  return formater(c, v);
}
const champsDe = (liste, raw) => liste.map(x => [(x.nom || '').trim() || libel(x.c), fmt(x.c, raw[x.c]), x]).filter(a => a[1] !== null);
const etatSections = new Map();   // mémorise les sections que vous avez dépliées / repliées
function corpsFiche(d) {
  const secs = cfg.sections.map((sec, i) => ({ sec, i, l: champsDe(sec.cols, valeurs(d)) })).filter(x => x.l.length);
  if (!secs.length) return '<p class="vide">Aucune section à afficher. Cliquez sur « ⚙ Réglages de la fiche » (en haut à gauche de la carte) pour créer vos sections.</p>';
  const ouvert = (k, i) => etatSections.has(k) ? etatSections.get(k) : (OUVERTURE === 'toutes' || (OUVERTURE === 'premiere' && i === 0));
  return (secs.length > 1 ? '<div class="fp-outils"><button type="button" class="fp-tout">Tout déplier / replier</button></div>' : '') +
    secs.map((x, k) => `<details class="theme" data-t="s${x.i}"${ouvert('s' + x.i, k) ? ' open' : ''}><summary>${esc(x.sec.nom || 'Section')} <span class="nb">(${x.l.length})</span></summary>${lignes(x.l)}</details>`).join('');
}

function ouvrirFiche(id, focus = true) {
  const m = marqueurs.get(id); if (!m) return;
  const d = m._cifi; ficheId = id;
  panneau.style.setProperty('--niv', d.niv.couleur);
  panneau.innerHTML =
    `<div class="fp-tete"><button type="button" class="fp-fermer" aria-label="Fermer la fiche">✕</button>
       <h2>${esc(d.nom || 'Sans nom')}</h2>
       <span class="niv" style="background:${d.niv.couleur};color:${d.niv.cle==='moyen'?'#1d2733':'#fff'}">${esc(d.niv.texte || d.niv.label)}</span></div>
     <div class="fp-corps">${corpsFiche(d)}</div>
     <div class="fp-pied"><button type="button" class="fp-select">Sélectionner la ligne dans Grist</button></div>`;
  panneau.classList.add('ouvert'); panneau.setAttribute('aria-hidden', 'false');
  if (focus) panneau.querySelector('.fp-fermer').focus();
}
function fermerFiche() {
  ficheId = null; panneau.classList.remove('ouvert'); panneau.setAttribute('aria-hidden', 'true');
}
panneau.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.theme')) etatSections.set(e.target.dataset.t, e.target.open); }, true);
panneau.addEventListener('click', e => {
  if (e.target.closest('.fp-fermer')) fermerFiche();
  if (e.target.closest('.fp-tout')) {
    const tous = [...panneau.querySelectorAll('details.theme')], ouvrir = tous.some(x => !x.open);
    tous.forEach(x => { x.open = ouvrir; });
  }
  const sel = e.target.closest('.fp-select');
  if (sel && ficheId !== null) {
    grist.setSelectedRows([ficheId]);
    if (grist.setCursorPos) grist.setCursorPos({ rowId: ficheId });
    sel.textContent = '✓ Ligne sélectionnée dans Grist';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ficheId !== null) fermerFiche(); });

map.on('popupopen', e => {
  const el = e.popup.getElement(); if (!el) return;
  const b = el.querySelector('.btn-fiche'); if (!b) return;
  L.DomEvent.disableClickPropagation(b);
  b.addEventListener('click', () => { ouvrirFiche(Number(b.dataset.id)); map.closePopup(); });
});

function icone(niv, sel) {
  return L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16],
    html:`<div class="pin ${niv.cle}${sel?' sel':''}" style="background:${niv.couleur}"><span>${niv.lettre}</span></div>` });
}

function fichier(d) {
  return `<div class="fiche" style="--niv:${d.niv.couleur}">
    <header><h3>${esc(d.nom || 'Sans nom')}</h3>
      <span class="niv" style="background:${d.niv.couleur};color:${d.niv.cle==='moyen'?'#1d2733':'#fff'}">${esc(d.niv.texte || d.niv.label)}</span></header>
    <div class="corps">${cfg.popup.length ? lignes(champsDe(cfg.popup, valeurs(d))) : '<p style="padding:10px 14px;margin:0;color:var(--muted);font-size:13px">Choisissez les colonnes du popup dans ⚙ Réglages.</p>'}</div>
    <div class="pied"><button type="button" class="btn-fiche" data-id="${Number(d.id)}">Voir la fiche complète</button></div></div>`;
}

/* ================= GRIST ================= */
let sansGps = 0;
grist.ready({
  requiredAccess: 'full',   // nécessaire pour lister toutes les colonnes (widget à héberger sur un serveur de confiance)
  allowSelectBy: true,
  columns: [
    { name:'nom',    title:'Nom de l’établissement', type:'Text' },
    { name:'lat',    title:'Latitude',  type:'Numeric' },
    { name:'lng',    title:'Longitude', type:'Numeric' },
    { name:'niveau', title:'Niveau de risque (Faible, Moyen, Élevé, Critique)', type:'Any', optional:true },
  ],
});

// Se déclenche à chaque modification de la table : la carte se met à jour seule.
grist.onRecords((records, mappings) => {
  const mapped = grist.mapColumnNames(records);
  if (!mapped) {
    afficherMsg('<div><strong>Associez les colonnes</strong><br>Dans le panneau de droite, indiquez le nom, la latitude et la longitude.</div>');
    return;
  }
  afficherMsg('');
  if (!allCols.length) allCols = Object.keys(records[0] || {}).filter(k => k !== 'id' && k !== 'manualSort');
  if (!labelsCharges) chargerLibelles(); else chargerTable();
  const vus = new Set(); sansGps = 0;

  records.forEach((raw, i) => {
    const r = mapped[i], lat = Number(r.lat), lng = Number(r.lng);
    if (r.lat == null || r.lng == null || r.lat === '' || r.lng === '' || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) { sansGps++; return; }
    const data = { id:raw.id, nom:r.nom, niv:niveau(r.niveau), raw };
    vus.add(raw.id);

    let m = marqueurs.get(raw.id);
    if (m) { m.setLatLng([lat,lng]); }
    else {
      m = L.marker([lat,lng], { title:r.nom || '', keyboard:true });
      m.bindPopup(() => fichier(m._cifi), { maxWidth:320, className:'cifi-popup' });
      m.on('click', () => grist.setSelectedRows([raw.id]));
      marqueurs.set(raw.id, m);
    }
    m._cifi = data;
    m.setIcon(icone(data.niv, raw.id === idSelectionne));
    if (m.isPopupOpen()) m.getPopup().update();     // la fiche ouverte se rafraîchit aussi
  });

  for (const [id, m] of [...marqueurs]) if (!vus.has(id)) { cluster.removeLayer(m); marqueurs.delete(id); }
  appliquerFiltres();
  if (ficheId !== null) { marqueurs.has(ficheId) ? ouvrirFiche(ficheId, false) : fermerFiche(); }
  if (premierChargement && marqueurs.size) { recentrer(); premierChargement = false; }
}, { includeColumns: 'normal' });

let labelsCharges = false, tid = null, types = {}, donnees = new Map(), erreurAcces = '';
const valeurs = d => donnees.get(d.id) || d.raw;
async function chargerLibelles() {   // libellés et types des colonnes (accès complet)
  labelsCharges = true;
  try {
    tid = await grist.selectedTable.getTableId();
    const T = await grist.docApi.fetchTable('_grist_Tables'), C = await grist.docApi.fetchTable('_grist_Tables_column');
    const ref = T.id[T.tableId.indexOf(tid)];
    C.id.forEach((_, k) => { if (C.parentId[k] === ref) { labels[C.colId[k]] = C.label[k]; types[C.colId[k]] = C.type[k]; } });
  } catch (e) { console.warn('Libellés indisponibles', e); }
  chargerTable();
}
async function chargerTable() {      // toutes les colonnes et toutes les lignes de la table
  try {
    if (!tid) tid = await grist.selectedTable.getTableId();
    const t = await grist.docApi.fetchTable(tid);
    const cols = Object.keys(t).filter(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper_'));
    const m = new Map();
    t.id.forEach((id, k) => { const o = {}; cols.forEach(c => { o[c] = t[c][k]; }); m.set(id, o); });
    allCols = cols; donnees = m; erreurAcces = '';
  } catch (e) { erreurAcces = String((e && e.message) || e); }
  rafraichir(); if (modal.classList.contains('ouvert')) dessinerReglages();
}
function rafraichir() {
  if (ficheId !== null) ouvrirFiche(ficheId, false);
  marqueurs.forEach(m => { if (m.isPopupOpen()) m.getPopup().update(); });
}
grist.onOptions(o => {
  const c = (o && o.cfg) || {}, norm = l => (l || []).map(x => ({ c: x.c, nom: x.nom || '', gn: x.gn ?? !!x.gras, vs: x.vs || '' }));
  cfg = { popup: norm(c.popup), sections: (c.sections || []).map(sec => ({ nom: sec.nom, cols: norm(sec.cols) })) };
  rafraichir();
});

/* ---- Fenêtre de réglages ---- */
const modal = document.createElement('div'); modal.id = 'reglages'; document.body.appendChild(modal);
let minuteur;
function sauver() { clearTimeout(minuteur); minuteur = setTimeout(() => { Promise.resolve(grist.setOptions({ cfg })).catch(() => alert('Vous n’avez pas le droit de modifier ces réglages.')); }, 300); rafraichir(); dessinerReglages(); }
const listeDe = g => g === 'p' ? cfg.popup : cfg.sections[+g].cols;
function blocListe(g) {
  const l = listeDe(g), dispo = allCols.filter(c => !l.some(x => x.c === c));
  return `<ul>${l.map((x, i) => `<li><div class="rg-l1"><span class="nomcol">${esc(libel(x.c))}${x.nom ? ' <small>→ ' + esc(x.nom) + '</small>' : ''}</span>
      <button type="button" data-a="up" data-g="${g}" data-i="${i}" aria-label="Monter">▲</button><button type="button" data-a="down" data-g="${g}" data-i="${i}" aria-label="Descendre">▼</button><button type="button" data-a="del" data-g="${g}" data-i="${i}" aria-label="Retirer">✕</button></div>
      <div class="rg-l2"><input type="text" value="${esc(x.nom || '')}" placeholder="Nom affiché (par défaut : ${esc(libel(x.c))})" data-a="lib" data-g="${g}" data-i="${i}" aria-label="Nom affiché">
      <label><input type="checkbox" data-a="gn" data-g="${g}" data-i="${i}"${x.gn ? ' checked' : ''}> nom en gras</label>
      <select data-a="vs" data-g="${g}" data-i="${i}" aria-label="Forme de la valeur">${[['', 'Valeur normale'], ['b', 'Valeur en gras'], ['i', 'Valeur en italique'], ['badge', 'Valeur en pastille']].map(([v, t]) => `<option value="${v}"${(x.vs || '') === v ? ' selected' : ''}>${t}</option>`).join('')}</select></div></li>`).join('')}</ul>
    <select data-a="add" data-g="${g}" aria-label="Ajouter une colonne"><option value="">+ Ajouter une colonne…</option>${dispo.map(c => `<option value="${esc(c)}">${esc(libel(c))}</option>`).join('')}</select>`;
}
function dessinerReglages() {
  const y = (modal.querySelector('.rg-corps') || {}).scrollTop || 0;
  modal.innerHTML = `<div class="rg-boite" role="dialog" aria-label="Réglages de la fiche"><div class="rg-tete"><h2>Réglages de la fiche</h2><button type="button" data-a="fermer">Fermer</button></div>
    <div class="rg-corps">${erreurAcces ? `<p style="color:#c1121f;font-size:13px">Impossible de lire toutes les colonnes : vérifiez que le widget est bien en « Accès complet » dans le panneau de droite de Grist. (${esc(erreurAcces)})</p>` : `<p class="vide" style="font-size:13px;margin:10px 0 0">${allCols.length} colonnes détectées dans la table.</p>`}<section><h3>Popup (clic sur un point)</h3>${blocListe('p')}</section>
    ${cfg.sections.map((sec, i) => `<section><div class="rg-sec"><input type="text" value="${esc(sec.nom)}" data-a="nom" data-g="${i}" aria-label="Nom de la section">
      <button type="button" data-a="sup" data-g="${i}" aria-label="Monter la section">▲</button><button type="button" data-a="sdown" data-g="${i}" aria-label="Descendre la section">▼</button><button type="button" data-a="sdel" data-g="${i}">Supprimer</button></div>${blocListe(String(i))}</section>`).join('')}
    <button type="button" class="rg-ajout" data-a="sadd">+ Ajouter une section</button></div></div>`;
  modal.querySelector('.rg-corps').scrollTop = y;
}
function ouvrirReglages() { dessinerReglages(); modal.classList.add('ouvert'); }
function deplacer(l, i, d) { const j = i + d; if (j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; }
modal.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const a = b.dataset.a, g = b.dataset.g, i = +b.dataset.i;
  if (e.target === modal || a === 'fermer') { modal.classList.remove('ouvert'); return; }
  if (a === 'up' || a === 'down') deplacer(listeDe(g), i, a === 'up' ? -1 : 1);
  else if (a === 'del') listeDe(g).splice(i, 1);
  else if (a === 'sup' || a === 'sdown') deplacer(cfg.sections, +g, a === 'sup' ? -1 : 1);
  else if (a === 'sdel') { if (!confirm('Supprimer cette section ?')) return; cfg.sections.splice(+g, 1); }
  else if (a === 'sadd') cfg.sections.push({ nom: 'Nouvelle section', cols: [] });
  else return;
  sauver();
});
modal.addEventListener('change', e => {
  const t = e.target, a = t.dataset.a, g = t.dataset.g; if (!a) return;
  if (a === 'add' && t.value) listeDe(g).push({ c: t.value, nom: '', gn: false, vs: '' });
  else if (a === 'gn') listeDe(g)[+t.dataset.i].gn = t.checked;
  else if (a === 'vs') listeDe(g)[+t.dataset.i].vs = t.value;
  else if (a === 'lib') listeDe(g)[+t.dataset.i].nom = t.value;
  else if (a === 'nom') cfg.sections[+g].nom = t.value;
  else return;
  sauver();
});
modal.addEventListener('mousedown', e => { if (e.target === modal) modal.classList.remove('ouvert'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('ouvert'); });

// Ligne sélectionnée dans Grist → mise en évidence et centrage sur la carte
grist.onRecord(rec => {
  const ancien = marqueurs.get(idSelectionne);
  idSelectionne = rec ? rec.id : null;
  if (ancien) ancien.setIcon(icone(ancien._cifi.niv, false));
  const m = marqueurs.get(idSelectionne);
  if (!m) return;
  const dejaOuverte = m.isPopupOpen();
  m.setIcon(icone(m._cifi.niv, true));
  if (!dejaOuverte && cluster.hasLayer(m)) cluster.zoomToShowLayer(m, () => { map.panTo(m.getLatLng()); m.openPopup(); });
});
</script>
</body>
</html>
